<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>直升機 AR 定位演示</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #10151c;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: linear-gradient(#2b3d52 0%, #2b3d52 55%, #3a4a3a 55%, #3a4a3a 100%);
  }
  #three-wrap { position: fixed; inset: 0; touch-action: none; }
  #three-wrap canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  #hud .pill {
    background: rgba(15, 20, 28, 0.6); backdrop-filter: blur(6px);
    color: #eafff0; font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #hud .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:6px; box-shadow:0 0 6px #22c55e; }

  #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,14,20,0.85), rgba(10,14,20,0.55) 70%, transparent);
    display: flex; flex-direction: column; gap: 10px;
  }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row label {
    color: #cfe8d8; font-size: 13px; width: 78px; flex-shrink: 0;
  }
  .slider-row input[type=range] {
    flex: 1; height: 34px; -webkit-appearance: none; background: transparent;
  }
  .slider-row input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px;
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; margin-top: -9px; width: 22px; height: 22px; border-radius: 50%;
    background: #22c55e; border: 2px solid #eafff0; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .slider-row .val {
    color: #eafff0; font-size: 12px; width: 54px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  #resetViewBtn {
    align-self: flex-end;
    background: rgba(255,255,255,0.1); color: #eafff0; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; padding: 6px 12px; font-size: 12px;
  }
  #resetViewBtn:active { background: rgba(255,255,255,0.25); }

  #startOverlay {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(circle at 50% 30%, #1b2530, #0a0d12 75%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  #startOverlay h1 { color: #eafff0; font-size: 18px; margin: 0; font-weight: 600; }
  #startOverlay p { color: #9fb3a6; font-size: 13px; margin: 0; max-width: 280px; line-height: 1.6; }
  #startBtn {
    background: #22c55e; color: #08130c; border: none; border-radius: 999px;
    padding: 14px 36px; font-size: 15px; font-weight: 700; box-shadow: 0 4px 18px rgba(34,197,94,0.4);
  }
  #startBtn:active { transform: scale(0.97); }
  #startOverlay.hidden { display: none; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<div id="three-wrap"></div>

<div id="hud">
  <div class="pill"><span class="status-dot"></span>已定位（模擬）</div>
  <div class="pill" id="hint-pill">拖曳畫面可環顧四周</div>
</div>

<div id="controls">
  <div class="slider-row">
    <label for="slider-z">前後定位</label>
    <input type="range" id="slider-z" min="-5" max="2" step="0.05" value="-3">
    <span class="val" id="val-z">-3.00 m</span>
  </div>
  <div class="slider-row">
    <label for="slider-y">上下定位</label>
    <input type="range" id="slider-y" min="-1" max="3" step="0.01" value="0.32">
    <span class="val" id="val-y">0.32 m</span>
  </div>
  <div class="slider-row">
    <label for="slider-scale">縮放</label>
    <input type="range" id="slider-scale" min="0.1" max="5" step="0.05" value="1.45">
    <span class="val" id="val-scale">1.45x</span>
  </div>
  <button id="resetViewBtn">重設視角</button>
</div>

<div id="startOverlay">
  <h1>直升機 AR 定位演示</h1>
  <p>會嘗試開啟相機作為背景，並假裝直升機已經定位完成，讓你直接用下方滑桿調整上下位置與縮放。</p>
  <button id="startBtn">開始</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const wrap = document.getElementById('three-wrap');
const camVideo = document.getElementById('cam');
const hintPill = document.getElementById('hint-pill');

// ── Three.js 基本場景 ──────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
const EYE_HEIGHT = 1.5; // 假設手機拿在胸口高度（公尺），地板 y=0 相對於此高度
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(3, 5, 2);
scene.add(dirLight);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── 假裝已定位的地板標記（跟正式版 placementMarker 一樣的綠色圈圈＋參考網格）──
// 錨點代表「已偵測到的地板位置」，固定不動；直升機用 yOffset／zOffset 相對錨點做微調，
// 跟正式版 chopperPosDebug 的邏輯一樣（地板標記本身不會跟著飛機的上下/前後滑桿一起動）
const ANCHOR_DIST = 3;
const anchor = new THREE.Vector3(0, -EYE_HEIGHT, -ANCHOR_DIST);

const markerMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
const marker = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.78, 48), markerMat);
marker.rotation.x = -Math.PI / 2;
marker.position.copy(anchor);
scene.add(marker);

const gridFillMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false });
const gridFill = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2), gridFillMat);
gridFill.rotation.x = -Math.PI / 2;
gridFill.position.copy(anchor);
scene.add(gridFill);

const gridHelper = new THREE.GridHelper(3.2, 8, 0x22c55e, 0x22c55e);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.3;
gridHelper.material.depthWrite = false;
gridHelper.position.copy(anchor);
scene.add(gridHelper);

// ── 直升機模型（沿用正式版的置中/縮放/掛載旋轉邏輯，讓演示跟實機顯示一致）──
const CHOPPER_ROT_DEG = { x: -168, y: -90, z: -168 }; // 對齊 index.html 的預設掛載旋轉
let chopper = null;
let chopperModel = null;
let chopperBaseScale = 1;
let mixer = null;
const clock = new THREE.Clock();

let yOffset = 0.32;
let zOffset = -3;
let scaleValue = 1.45;

new GLTFLoader().load('low_poly_helicopter.glb', gltf => {
  const obj = gltf.scene;

  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center); // 只做置中平移，obj 本身不旋轉，避免平移量跟著自己的旋轉跑掉
  chopperBaseScale = 2.6 / Math.max(size.x, size.y, size.z);

  chopperModel = obj;
  obj.scale.setScalar(chopperBaseScale * scaleValue);

  chopper = new THREE.Group();
  chopper.add(obj);
  // 掛載旋轉套在外層的 group，而不是套在 obj 自己身上：obj.position 已經是「置中平移」，
  // 若直接旋轉 obj 自己，平移量不會跟著轉，會把模型整個甩到畫面外
  chopper.rotation.set(
    THREE.MathUtils.degToRad(CHOPPER_ROT_DEG.x),
    THREE.MathUtils.degToRad(CHOPPER_ROT_DEG.y),
    THREE.MathUtils.degToRad(CHOPPER_ROT_DEG.z)
  );
  chopper.position.set(anchor.x, anchor.y + yOffset, anchor.z - zOffset);
  scene.add(chopper);

  if (gltf.animations && gltf.animations.length) {
    mixer = new THREE.AnimationMixer(obj);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }
});

// ── 滑桿：前後定位 / 上下定位 / 縮放 ─────────────────────────
// 前後／上下都只調整直升機相對錨點的偏移量，地板標記（圈圈＋網格）維持在原偵測位置不動
const sliderZ = document.getElementById('slider-z');
const sliderY = document.getElementById('slider-y');
const sliderScale = document.getElementById('slider-scale');
const valZ = document.getElementById('val-z');
const valY = document.getElementById('val-y');
const valScale = document.getElementById('val-scale');

sliderZ.addEventListener('input', () => {
  zOffset = parseFloat(sliderZ.value);
  valZ.textContent = zOffset.toFixed(2) + ' m';
  if (chopper) chopper.position.z = anchor.z - zOffset;
});
sliderY.addEventListener('input', () => {
  yOffset = parseFloat(sliderY.value);
  valY.textContent = yOffset.toFixed(2) + ' m';
  if (chopper) chopper.position.y = anchor.y + yOffset;
});
sliderScale.addEventListener('input', () => {
  scaleValue = parseFloat(sliderScale.value);
  valScale.textContent = scaleValue.toFixed(2) + 'x';
  if (chopperModel) chopperModel.scale.setScalar(chopperBaseScale * scaleValue);
});

// ── 視角控制：優先用裝置陀螺儀（跟真實 AR 一樣抬頭看/轉身看），
//    沒有權限或桌機沒有感測器時，退回拖曳看視角 ──────────────
let useDeviceOrientation = false;
let baseAlphaOffset = null;

const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function setCameraQuaternionFromDevice(alpha, beta, gamma, screenOrient) {
  euler.set(THREE.MathUtils.degToRad(beta), THREE.MathUtils.degToRad(alpha), -THREE.MathUtils.degToRad(gamma), 'YXZ');
  camera.quaternion.setFromEuler(euler);
  camera.quaternion.multiply(q1);
  camera.quaternion.multiply(q0.setFromAxisAngle(zee, -THREE.MathUtils.degToRad(screenOrient)));
}

function onDeviceOrientation(e) {
  if (e.alpha === null) return;
  useDeviceOrientation = true;
  hintPill.textContent = '轉動手機可環顧四周';
  const screenOrient = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  setCameraQuaternionFromDevice(e.alpha, e.beta, e.gamma, screenOrient);
}

// ── 拖曳看視角（桌機測試 / 無感測器權限時的備援）────────────
let dragYaw = 0, dragPitch = 0;
let dragging = false, lastX = 0, lastY = 0;

function applyDragLook() {
  euler.set(dragPitch, dragYaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!dragging || useDeviceOrientation) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dragYaw -= dx * 0.005;
  dragPitch -= dy * 0.005;
  dragPitch = Math.max(-1.3, Math.min(1.3, dragPitch));
  applyDragLook();
});
window.addEventListener('pointerup', () => { dragging = false; });

document.getElementById('resetViewBtn').addEventListener('click', () => {
  dragYaw = 0; dragPitch = 0;
  applyDragLook();
});

// ── 相機背景（模擬 AR 鏡頭畫面）與啟動流程 ───────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false,
    });
    camVideo.srcObject = stream;
  } catch (err) {
    // 拿不到相機權限（桌機常見）就維持預設的天空/地板漸層背景
    console.warn('無法取得相機畫面，改用預設背景', err);
  }
}

async function requestOrientationPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') return;
    } catch (err) {
      return;
    }
  }
  window.addEventListener('deviceorientation', onDeviceOrientation);
}

document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('startOverlay').classList.add('hidden');
  await startCamera();
  await requestOrientationPermission();
  applyDragLook();
});

// ── 主渲染迴圈 ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
