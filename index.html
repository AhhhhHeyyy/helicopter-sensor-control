<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>感測器即時顯示</title>
<script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" data-preload-chunks="slam"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f0f; color: #fff;
    height: 100dvh;
    overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: clamp(10px, 3dvh, 24px) 16px;
    --joy-size: min(220px, 28dvh, 58vw);
    --knob-size: min(82px, calc(var(--joy-size) * 0.375));
  }
  #screen-permission, #screen-live { width: 100%; max-width: 360px; text-align: center; }
  #screen-permission { margin: auto 0; }
  /* 即時顯示畫面：相機/3D 視窗全螢幕，UI 搖桿以浮動層疊加在最上方 */
  #screen-live {
    position: fixed; inset: 0; z-index: 1;
    width: auto; max-width: none;
    display: flex; flex-direction: column;
  }
  #display-half {
    position: absolute; inset: 0;
  }
  #display-half h2 { display: none; }
  #control-half {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    gap: clamp(8px, 2dvh, 20px);
    padding: 0 16px max(env(safe-area-inset-bottom, 12px), 12px);
    pointer-events: none;
  }
  #control-half > * { pointer-events: auto; }
  .hidden { display: none !important; }
  h2 { font-size: 1.4rem; margin-bottom: 8px; }
  p  { font-size: 0.9rem; color: #aaa; line-height: 1.5; }
  .btn {
    margin-top: 28px; padding: 16px 0; width: 100%; border-radius: 14px; border: none;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
    background: #2563eb; color: #fff;
  }
  .btn:active { opacity: 0.8; }
  .status-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; background: #22c55e;
  }
  #status-bar {
    width: 100%;
    margin-top: clamp(8px, 2dvh, 24px); padding: 10px 16px; border-radius: 10px;
    background: #1f1f1f; font-size: 0.85rem; text-align: left;
  }
  #status-bar div { margin: 3px 0; }
  #cam-debug {
    width: 100%;
    margin-top: clamp(8px, 2dvh, 16px); padding: 10px 16px; border-radius: 10px;
    background: #1f1f1f; font-size: 0.8rem; text-align: left;
  }
  /* ── 偵錯面板：浮動於畫面底部，不佔用版面、不擠壓 3D 視窗 ── */
  #debug-toggle {
    position: fixed; top: 10px; left: 10px; z-index: 201;
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid #444; background: rgba(15,15,15,0.88);
    color: #aaa; font-size: 0.78rem; cursor: pointer;
  }
  #debug-toggle:active { opacity: 0.7; }
  #debug-panel {
    display: none;
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 200;
    width: min(300px, 85vw); overflow-y: auto;
    background: rgba(15,15,15,0.97);
    border-right: 1px solid #333;
    padding: 56px 16px 16px;
  }
  #debug-panel.open { display: block; }
  /* ── 快調面板：直升機前後/上下/縮放，永遠顯示，不用開「調整面板」才看得到 ── */
  #quick-adjust {
    position: fixed; top: 48px; left: 50%; transform: translateX(-50%); z-index: 600;
    width: min(260px, 88vw);
    background: rgba(15,15,15,0.88);
    border: 1px solid #333; border-radius: 10px;
    padding: 8px 12px;
  }
  .qa-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .qa-row label { width: 56px; flex-shrink: 0; color: #ccc; font-size: 0.75rem; }
  .qa-row input[type="range"] { flex: 1; }
  .qa-row span { width: 40px; text-align: right; color: #4dd9f0; flex-shrink: 0; font-size: 0.75rem; }
  #chopper-scale-save {
    flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid #444;
    background: rgba(77,217,240,0.12); color: #4dd9f0; font-size: 0.75rem; cursor: pointer;
  }
  #chopper-scale-save:active { opacity: 0.7; }
  #chopper-scale-save-status { width: auto; text-align: left; font-size: 0.7rem; color: #888; }
  .cam-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .cam-row label { width: 60px; color: #888; flex-shrink: 0; }
  .cam-row input[type="range"] { flex: 1; }
  .cam-row span { width: 40px; text-align: right; color: #4dd9f0; flex-shrink: 0; }
  .cam-row .cam-max {
    width: 52px; flex-shrink: 0; padding: 2px 4px; border-radius: 6px;
    border: 1px solid #444; background: #111; color: #888; font-size: 0.78rem;
  }
  #three-wrap {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    margin: 0; border-radius: 0; overflow: hidden;
    background: #111;
  }
  #three-wrap canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; background: transparent; }
  #camera-bg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #disconnect-btn {
    padding: 10px 0; width: 100%; border-radius: 10px; border: 1px solid #555;
    background: transparent; color: #aaa; font-size: 0.9rem; cursor: pointer;
  }
  #joystick-section { width: 100%; }
  #joy-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(6px, 1.5dvh, 16px); }
  #joy-section-header h3 { font-size: 0.85rem; color: #555; letter-spacing: 0.05em; margin: 0; }
  #swap-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid #444;
    background: transparent; color: #888; font-size: 0.78rem; cursor: pointer;
  }
  #swap-btn:active { opacity: 0.7; }
  #controls-row { display: flex; align-items: center; justify-content: center; gap: 24px; }
  #controls-row.swapped { flex-direction: row-reverse; }
  #grab-section {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 2dvh, 16px);
  }
  .action-btn {
    width: min(88px, calc(var(--joy-size) * 0.4));
    height: min(88px, calc(var(--joy-size) * 0.4));
    border-radius: 50%;
    color: #fff; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; touch-action: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.08s, box-shadow 0.08s, transform 0.08s;
  }
  #grab-btn {
    border: 2px solid rgba(239,68,68,0.55);
    background: radial-gradient(circle at 40% 35%, #4e1a1a, #2c0a0a 75%, #1a0505);
    box-shadow: 0 0 16px rgba(239,68,68,0.18);
  }
  #grab-btn.pressed {
    background: radial-gradient(circle at 40% 35%, #b33030, #751c1c 75%, #430a0a);
    box-shadow: 0 0 28px rgba(239,68,68,0.55);
    transform: scale(0.95);
  }
  #alt-btn {
    border: 2px solid rgba(34,197,94,0.55);
    background: radial-gradient(circle at 40% 35%, #1a4e2a, #0a2c14 75%, #051a08);
    box-shadow: 0 0 16px rgba(34,197,94,0.18);
  }
  #alt-btn.pressed {
    background: radial-gradient(circle at 40% 35%, #30b354, #1c751c 75%, #0a430a);
    box-shadow: 0 0 28px rgba(34,197,94,0.55);
    transform: scale(0.95);
  }
  #joy-base {
    position: relative; width: var(--joy-size); height: var(--joy-size); border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #0e3a4e 0%, #082030 65%, #041420 100%);
    margin: 0 auto; touch-action: none; user-select: none;
    -webkit-tap-highlight-color: transparent; cursor: pointer;
  }
  #joy-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
  }
  .joy-arrow { position: absolute; width: 0; height: 0; opacity: 0.65; }
  .joy-arrow-up    { top: 13px;    left: 50%; transform: translateX(-50%);
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 13px solid #a8dde8; }
  .joy-arrow-down  { bottom: 13px; left: 50%; transform: translateX(-50%);
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 13px solid #a8dde8; }
  .joy-arrow-left  { left: 13px;   top: 50%;  transform: translateY(-50%);
    border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-right: 13px solid #a8dde8; }
  .joy-arrow-right { right: 13px;  top: 50%;  transform: translateY(-50%);
    border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 13px solid #a8dde8; }
  #joy-knob {
    position: absolute; top: 50%; left: 50%;
    width: var(--knob-size); height: var(--knob-size); border-radius: 50%;
    margin: calc(var(--knob-size) / -2) 0 0 calc(var(--knob-size) / -2);
    background: radial-gradient(circle at 40% 35%, #1e6080, #0c2e42 75%, #07202e);
    border: 2px solid rgba(77,217,240,0.55);
    box-shadow: 0 0 16px rgba(77,217,240,0.18);
    will-change: transform;
  }
  #joy-knob::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc(var(--knob-size) * 0.61); height: calc(var(--knob-size) * 0.61); border-radius: 50%;
    border: 1px solid rgba(77,217,240,0.3);
  }
  #joy-knob.snap { transition: transform 0.14s ease-out; }
  #joy-hint { display: none; font-size: 0.72rem; color: #444; margin-top: clamp(6px, 1.5dvh, 12px); }
  /* ── 橫直切換按鈕 ── */
  #orient-btn {
    position: fixed; top: 10px; right: 10px; z-index: 100;
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid #444; background: rgba(15,15,15,0.88);
    color: #aaa; font-size: 0.78rem; cursor: pointer;
  }
  #orient-btn:active { opacity: 0.7; }
  /* ── 橫式模式 ── */
  body.landscape {
    padding: 0; align-items: stretch;
    height: 100dvh; overflow: hidden;
    --joy-size: min(220px, calc(50dvh - 10px));
    --knob-size: min(82px, calc(var(--joy-size) * 0.375));
  }
  /* 橫式：相機/3D 視窗（#display-half、#three-wrap 繼承自上方的全螢幕設定）維持全螢幕，
     #control-half 改為橫向排列的浮動疊加層覆蓋整個畫面 */
  body.landscape #control-half {
    inset: 0;
    flex-direction: row;
    align-items: stretch; justify-content: space-between;
    padding: 0; gap: 0;
  }
  body.landscape #status-bar {
    position: fixed; top: env(safe-area-inset-top, 8px); left: 50%; transform: translateX(-50%);
    width: auto; white-space: nowrap; margin: 0;
    padding: 5px 16px; font-size: 0.75rem;
    display: flex; flex-direction: row; gap: 14px; text-align: center;
  }
  body.landscape #status-bar div { margin: 0; }
  body.landscape #disconnect-btn {
    position: fixed; bottom: max(env(safe-area-inset-bottom, 0px), 10px);
    right: max(env(safe-area-inset-right, 0px), 10px);
    width: auto; margin: 0; padding: 8px 18px;
  }
  body.landscape #joystick-section {
    flex: 1; margin: 0;
    display: flex; flex-direction: column; align-items: stretch;
    justify-content: flex-end;
  }
  body.landscape #joy-section-header { display: none; }
  body.landscape #joy-hint { display: none; }
  body.landscape #controls-row {
    height: 50dvh; gap: 0; align-items: stretch;
    margin-bottom: 4dvh;
  }
  body.landscape #grab-section {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(8px, 2dvh, 14px);
  }
  body.landscape #joy-wrapper {
    flex: 1; display: flex;
    align-items: center; justify-content: center;
    padding-right: max(env(safe-area-inset-right, 0px), 2%);
  }
  /* ── 橫式自適應大小 ── */
  body.landscape .action-btn {
    width: min(110px, calc(var(--joy-size) * 0.48));
    height: min(110px, calc(var(--joy-size) * 0.48));
    font-size: 1rem;
  }
  /* ── 姿態引導遮罩：不再全黑遮擋鏡頭畫面，改為半透明 HUD，靠畫面上方顯示避免蓋住下方
     搖桿操作區；符合角度後只變色，不會整個消失 ── 直到直升機真的放置成功才淡出。
     符合角度後改用 .clickthrough（只解除點擊阻擋，不影響顯示）取代直接隱藏，避免
     在門檻邊緣來回時整個遮罩閃現/消失 ── */
  #orient-guide {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; padding: 24px; padding-top: max(env(safe-area-inset-top, 0px), 14px);
    opacity: 1; transition: opacity 0.35s ease;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0) 30%);
  }
  #orient-guide.hidden-guide { opacity: 0; pointer-events: none; }
  #orient-guide.clickthrough { pointer-events: none; }
  #orient-hud { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .orient-arrow {
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    opacity: 0.25; transition: opacity 0.2s ease;
  }
  #orient-arrow-up { border-bottom: 15px solid #22d3ee; }
  #orient-arrow-down { border-top: 15px solid #22d3ee; }
  .orient-arrow.active { opacity: 1; animation: orient-arrow-up-pulse 0.9s ease-in-out infinite; }
  #orient-arrow-down.active { animation-name: orient-arrow-down-pulse; }
  @keyframes orient-arrow-up-pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes orient-arrow-down-pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  #orient-guide.ok .orient-arrow { opacity: 0; }
  /* 角度符合後不再需要調角度的軌道/水平儀，且畫面中央要留給地板定位圈點按，
     整組 HUD（軌道＋箭頭）直接收起，只留最上方一小條文字提示，避免蓋住圈圈 */
  #orient-guide.ok #orient-hud { display: none; }
  #orient-track { position: relative; width: min(150px, 50vw); height: min(30vh, 230px); }
  .orient-bracket {
    position: absolute; top: 0; bottom: 0; width: 3px;
    background: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .orient-bracket::before, .orient-bracket::after {
    content: ''; position: absolute; width: 16px; height: 3px; background: inherit; box-shadow: inherit;
  }
  .orient-bracket::before { top: 0; }
  .orient-bracket::after { bottom: 0; }
  #orient-bracket-left { left: 0; }
  #orient-bracket-left::before, #orient-bracket-left::after { left: 0; }
  #orient-bracket-right { right: 0; }
  #orient-bracket-right::before, #orient-bracket-right::after { right: 0; }
  #orient-guide.ok .orient-bracket { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.6); }
  #orient-zone {
    position: absolute; left: 0; right: 0; top: 50%; height: 26%; transform: translateY(-50%);
    background: rgba(34,211,238,0.08);
    border-top: 1px dashed rgba(34,211,238,0.4); border-bottom: 1px dashed rgba(34,211,238,0.4);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  #orient-guide.ok #orient-zone { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.55); }
  #orient-line {
    position: absolute; left: -14px; right: -14px; top: 50%; height: 4px; border-radius: 2px;
    background: #22d3ee; box-shadow: 0 0 10px rgba(34,211,238,0.7);
    transform: translateY(-50%);
    transition: background 0.15s ease, box-shadow 0.15s ease, top 0.08s linear, transform 0.08s linear;
  }
  #orient-guide.ok #orient-line { background: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.8); }
  #orient-guide-label {
    font-size: 0.88rem; color: #eee; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.35); padding: 6px 16px; border-radius: 999px;
  }
  #orient-guide-label.ok { color: #4ade80; }
  /* ── 防螢幕自動旋轉：手機旋回直式時，把橫式 UI 旋轉回來 ── */
  @media screen and (orientation: portrait) {
    body.landscape {
      position: fixed;
      width: 100dvh; height: 100dvw;
      min-height: 0;
      top: calc(50dvh - 50dvw);
      left: calc(50dvw - 50dvh);
      transform: rotate(90deg);
      overflow: hidden;
      /* 旋轉後的 landscape 高度 = portrait 的 dvw */
      --joy-size: min(220px, calc(50dvw - 10px));
    }
    body.landscape #screen-live {
      height: 100dvw; /* portrait dvw = 旋轉後的 landscape 高度 */
    }
    /* 旋轉後 dvh/dvw 互換：landscape 的「高度」= portrait dvw */
    body.landscape #controls-row { height: 50dvw; margin-bottom: 4dvw; }
  }
</style>
</head>
<body>

<!-- 畫面1：請求感測器權限（已自動觸發，不顯示） -->
<div id="screen-permission" class="hidden">
  <h2>感測器即時顯示</h2>
  <p>點下方按鈕授予感測器權限，即可在畫面上即時看到陀螺儀旋轉與搖桿位移數值。</p>
  <button class="btn" id="btn-start">開始顯示</button>
  <p id="perm-err" style="color:#ef4444;margin-top:12px;"></p>
</div>

<!-- 畫面2：即時顯示 -->
<div id="screen-live">
  <button id="orient-btn">切換橫式</button>
  <button id="debug-toggle">調整面板</button>

  <!-- 直升機定位快調面板：前後/上下/縮放，不用點「調整面板」展開就能直接看到、直接調 -->
  <div id="quick-adjust">
    <div class="qa-row">
      <label for="chopper-z">前後定位</label>
      <input type="range" id="chopper-z" min="-30" max="30" step="0.1" value="-3">
      <span id="chopper-z-val">-3</span>
      <input type="number" class="cam-max hidden" id="chopper-z-max" value="30" step="1">
    </div>
    <div class="qa-row">
      <label for="chopper-y">上下定位</label>
      <input type="range" id="chopper-y" min="-20" max="20" step="0.01" value="-0.75">
      <span id="chopper-y-val">-0.75</span>
      <input type="number" class="cam-max hidden" id="chopper-y-max" value="20" step="1">
    </div>
    <div class="qa-row">
      <label for="chopper-scale">縮放</label>
      <input type="range" id="chopper-scale" min="0.1" max="5" step="0.05" value="1.05">
      <span id="chopper-scale-val">1.05</span>
      <input type="number" class="cam-max hidden" id="chopper-scale-max" value="5" step="1">
    </div>
    <div class="qa-row">
      <label></label>
      <button type="button" id="chopper-scale-save">儲存目前縮放/定位為預設</button>
      <span id="chopper-scale-save-status"></span>
    </div>
  </div>

  <!-- 姿態引導遮罩：手機角度符合要求前持續顯示，符合後自動淡出 -->
  <div id="orient-guide">
    <div id="orient-hud">
      <div id="orient-arrow-up" class="orient-arrow"></div>
      <div id="orient-track">
        <div id="orient-bracket-left" class="orient-bracket"></div>
        <div id="orient-bracket-right" class="orient-bracket"></div>
        <div id="orient-zone"></div>
        <div id="orient-line"></div>
      </div>
      <div id="orient-arrow-down" class="orient-arrow"></div>
    </div>
    <div id="orient-guide-label">請將手機轉成垂直、螢幕面向自己</div>
  </div>

  <!-- 上半：顯示層 -->
  <div id="display-half">
    <h2><span class="status-dot"></span>即時顯示中</h2>
    <div id="three-wrap">
      <video id="camera-bg" autoplay playsinline muted></video>
    </div>
  </div>

  <!-- 浮動偵錯面板：感測器數值 + 相機調整，預設隱藏，不佔版面 -->
  <div id="debug-panel">
    <div id="status-bar">
      <div id="sb-orient">姿態：α0.0° β0.0° γ0.0°</div>
      <div id="sb-accel">加速度：x0.00 y0.00 z0.00</div>
      <div id="sb-joy">搖桿：H0.00 V0.00</div>
      <div id="sb-grab">抓取：放開</div>
      <div id="sb-hz">頻率：- Hz</div>
      <div id="sb-gyro-toggle" style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="gyro-control-toggle">
          陀螺儀控制角度／方向（實驗性，預設關閉）
        </label>
      </div>
    </div>
    <div id="cam-debug">
      <div class="cam-row">
        <label for="cam-x">offsetX</label>
        <input type="range" id="cam-x" min="-30" max="30" step="0.5" value="0">

<script>
// 與 3D 模組共享的即時狀態
window.controlState = {
  orientData: { alpha: 0, beta: 0, gamma: 0 },
  accelData:  { x: 0, y: 0, z: 0 },
  joyH: 0, joyV: 0,
  grabPressed: false,
  altUp: false, // 上升按鈕是否按住中（取代原本陀螺儀傾斜控制上下）
  alphaOffset: null, // 啟動感測器當下的 alpha，作為機頭正前方的基準
  betaOffset: null,  // 啟動感測器當下的 beta，作為「水平飛行」姿態基準（直拿手機時 beta≈90°）
  gammaOffset: null  // 啟動感測器當下的 gamma，作為「水平飛行」姿態基準
};
const cs = window.controlState;
// 陀螺儀控制機身角度／移動方向的開關，預設關閉；之後可在偵錯面板的核取方塊即時開啟
window.gyroControlEnabled = false;
document.getElementById('gyro-control-toggle').addEventListener('change', e => {
  window.gyroControlEnabled = e.target.checked;
});
let hzCount = 0, lastHzTime = Date.now();
let displayInterval = null, hzInterval = null;

// ── 偵錯面板開關（浮動於底部，預設隱藏）──────────────────
document.getElementById('debug-toggle').addEventListener('click', () => {
  document.getElementById('debug-panel').classList.toggle('open');
});

// ── 相機偵錯面板（即時調整跟隨相機的偏移與視角）────────────
window.cameraDebug = { x: 0, y: 2, z: 14, lookX: 0, lookY: 1.6, lookZ: 1.9, zoom: 2.6 };
['x', 'y', 'z', 'look-x', 'look-y', 'look-z', 'zoom'].forEach(key => {
  const prop    = key.startsWith('look-') ? 'look' + key.slice(5).toUpperCase() : key;
  const input   = document.getElementById('cam-' + key);
  const val     = document.getElementById('cam-' + key + '-val');
  const maxIn   = document.getElementById('cam-' + key + '-max');
  const signed  = key !== 'zoom'; // zoom 只能是正值

  input.addEventListener('input', () => {
    window.cameraDebug[prop] = parseFloat(input.value);
    val.textContent = input.value;
  });

  // 自訂滑桿的最大值（zoom 同時更新最小值，保持極小正值；其餘同步成對稱範圍 ±max）
  maxIn.addEventListener('change', () => {
    const m = parseFloat(maxIn.value);
    if (!isFinite(m) || m <= 0) return;
    input.max = m;
    input.min = signed ? -m : 0.05;
  });
});

// ── 城市場景縮放／位置／角度（即時調整）──────────────────
window.cityDebug = { scale: 1.1, x: 3.7, y: -1.1, z: 6.5, rot: -180 };
[
  ['city-scale', 'scale'],
  ['city-x', 'x'],
  ['city-y', 'y'],
  ['city-z', 'z'],
  ['city-rot', 'rot'],
].forEach(([id, prop]) => {
  const input = document.getElementById(id);
  const val   = document.getElementById(id + '-val');
  const maxIn = document.getElementById(id + '-max');
  const signed = prop !== 'scale'; // scale 只能是正值

  input.addEventListener('input', () => {
    window.cityDebug[prop] = parseFloat(input.value);
    val.textContent = input.value;
  });

  maxIn.addEventListener('change', () => {
    const m = parseFloat(maxIn.value);
    if (!isFinite(m) || m <= 0) return;
    input.max = m;
    if (signed) input.min = -m;
  });
});

// ── 直升機可移動範圍（即時調整）──────────────────────────
window.moveRangeDebug = { x: 200, y: 200, z: 200 };
[
  ['range-x', 'x'],
  ['range-z', 'z'],
].forEach(([id, prop]) => {
  const input = document.getElementById(id);
  const val   = document.getElementById(id + '-val');
  const maxIn = document.getElementById(id + '-max');

  input.addEventListener('input', () => {
    window.moveRangeDebug[prop] = parseFloat(input.value);
    val.textContent = input.value;
  });

  maxIn.addEventListener('change', () => {
    const m = parseFloat(maxIn.value);
    if (!isFinite(m) || m <= 0) return;
    input.max = m;
  });
});

// ── AR 校準值本地儲存（縮放、定位圈比例、上下/前後定位）───────
// 使用者在實機上把「縮放」「上下定位」等調到滿意後，可按「儲存目前縮放/定位為預設」
// 直接寫入 localStorage：下次同一台裝置/瀏覽器打開，AR 一開始就會套用這組校準過的值，
// 不用每次重新調整，也不用把數字報回來改原始碼。posX/posY/posZ 是舊版存檔可能沒有的
// 選填欄位，讀取時個別檢查、缺了就沿用程式內建預設，不影響 scale/ratio 是否套用。
const AR_CALIBRATION_KEY = 'chopperArCalibration';
function loadArCalibration() {
  try {
    const raw = localStorage.getItem(AR_CALIBRATION_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (typeof obj.scale === 'number' && obj.scale > 0 && typeof obj.ratio === 'number' && obj.ratio > 0) return obj;
  } catch (e) {}
  return null;
}
function numOr(v, fallback) {
  return typeof v === 'number' && isFinite(v) ? v : fallback;
}
const savedArCalibration = loadArCalibration();
// AR 模式進場時直升機縮放的預設值：有已儲存的校準值就用它，否則沿用實機測試調出來的 1.05
// （模型包圍盒不規則，縮放倍率跟實際公尺數並非單純線性換算，這個數字是直接在裝置上試出來的，
// 見 _startXR）
window.AR_DEFAULT_SCALE = savedArCalibration ? savedArCalibration.scale : 1.05;

// ── 直升機模型縮放（即時調整）────────────────────────────
window.chopperDebug = { scale: 1.05 };
{
  const input = document.getElementById('chopper-scale');
  const val   = document.getElementById('chopper-scale-val');
  const maxIn = document.getElementById('chopper-scale-max');

  // 供程式化改值時（例如進 AR 自動改縮放，見 _startXR）同步更新滑桿顯示，
  // 避免滑桿畫面上的數字跟實際套用的 chopperDebug.scale 對不起來
  window.setChopperScale = (v) => {
    window.chopperDebug.scale = v;
    input.value = v;
    val.textContent = v;
  };

  input.addEventListener('input', () => {
    window.setChopperScale(parseFloat(input.value));
  });

  maxIn.addEventListener('change', () => {
    const m = parseFloat(maxIn.value);
    if (!isFinite(m) || m <= 0) return;
    input.max = m;
  });

  // 「儲存目前縮放/定位為預設」：
  // - 用放置那一刻的定位圈半徑（window.lastPlacedReticleRadius，見 touchend 放置流程）與
  //   目前縮放值反推出兩者該有的比例，一起存進 localStorage。之所以反推比例而不是只存
  //   縮放值，是因為定位圈半徑＝縮放×比例，只改縮放的話兩者會一起等比例變大變小、視覺
  //   落差永遠不會消失，必須連同比例一起校準才能真正對齊。
  // - 同時存下目前的 chopperPosDebug.x/y/z（前後/上下/左右定位），下次載入直接套用成
  //   絕對偏移（見下方 chopperPosDebug 初始化），不用再手動調一次。
  const saveBtn = document.getElementById('chopper-scale-save');
  const saveStatus = document.getElementById('chopper-scale-save-status');
  saveBtn.addEventListener('click', () => {
    if (!window.lastPlacedReticleRadius) {
      saveStatus.textContent = '請先在 AR 中放置一次直升機';
      return;
    }
    const scale = window.chopperDebug.scale;
    const ratio = window.lastPlacedReticleRadius / scale;
    const pos = window.chopperPosDebug || {};

// ── 畫面切換 ──────────────────────────────────────────────
function show(id) {
  ['screen-permission','screen-live'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id));
}

// ── 姿態引導遮罩（從進入畫面持續顯示到直升機真正放置成功為止，角度符合時只變色，
// 不會整個消失／重新出現，避免在門檻邊緣來回時閃爍）───
// 直升機放置後（window.arPlaced）才淡出隱藏。
// window.orientGuideOk 提供給 AR 放置點按邏輯判斷「角度是否已符合」。
const ORIENT_GUIDE_TOL    = 30; // 誤差容許範圍（度，β 與 γ 合併計算的向量誤差）
const ORIENT_MAX_ERR_EDGE = 70; // 對應到軌道上下邊緣的誤差角度
const ORIENT_MAX_ROLL_DEG = 35; // 橫線最大傾斜角度（模擬水平儀，視覺效果用）
const HAPTIC_TICK_MIN_MS  = 90;  // 角度接近符合時的最短震動間隔（越密集）
const HAPTIC_TICK_MAX_MS  = 650; // 角度偏差很大時的最長震動間隔（越稀疏）
window.orientGuideOk = false;
const orientGuideEl     = document.getElementById('orient-guide');
const orientGuideLabel  = document.getElementById('orient-guide-label');
const orientLineEl      = document.getElementById('orient-line');
const orientArrowUpEl   = document.getElementById('orient-arrow-up');
const orientArrowDownEl = document.getElementById('orient-arrow-down');
let orientGuideOkPrev = false; // 上一輪是否已對齊，用來偵測「剛對齊」的那一瞬間
let lastHapticTick = 0;

function resetOrientGuide() {
  window.orientGuideOk = false;
  orientGuideOkPrev = false;
  orientGuideEl.classList.remove('hidden-guide', 'ok', 'clickthrough');
  orientGuideLabel.classList.remove('ok');
  orientGuideLabel.textContent = '請將手機轉成垂直、螢幕面向自己';
  orientLineEl.style.top = '50%';
  orientLineEl.style.transform = 'translateY(-50%)';
  orientArrowUpEl.classList.remove('active');
  orientArrowDownEl.classList.remove('active');
}

// 手機接近垂直（β≈90°）時，deviceorientation 的 alpha/gamma 會進入萬向鎖：極小的實際
// 轉動就會讓 gamma 讀值劇烈跳動，導致橫線傾斜角看起來很不穩定（原理性限制，不是手抖）。
// 改用重力加速度（devicemotion 的 accelerationIncludingGravity，見 cs.accelData）算左右
// 翻滾角，這個量不經過 alpha/beta/gamma 分解，沒有萬向鎖問題。
// 注意：X/Y 軸對應方向以直式手持為準推導，橫式的座標對調是比照現有 effBeta/effGamma
// 的橫式互換邏輯類推，尚未在實機的橫式模式下驗證過方向是否正確。
function getStableRollDeg(isLandscapeNow) {
  const ax = isLandscapeNow ? -cs.accelData.y : cs.accelData.x;
  const ay = isLandscapeNow ?  cs.accelData.x : cs.accelData.y;
  // 手機直立、螢幕正對使用者、無左右歪斜時，重力加速度應落在 +ay（沿裝置頂端方向），
  // ax≈0；此時要讀出 0°，須用 atan2(ax, ay)。先前誤用 atan2(ax, -ay)，沒有歪斜時基準值
  // 會算成 ±180° 而非 0°，且該讀數正好落在 atan2 的角度不連續處（±180° 交界），
  // 微小雜訊就會讓輸出在 +180°/-180° 間跳動——這正是橫線「不準」又「不穩定」的成因。
  return Math.atan2(ax, ay) * 180 / Math.PI;
}

// 橫線垂直位置反映 β 誤差（框內中段區＝角度已對齊），橫線傾斜角度反映左右翻滾角誤差
// （像水平儀，來源見上方 getStableRollDeg）；兩者皆在容許範圍內才判定 ok，此時框線與
// 橫線轉綠、文字改為下一步指示（對準地板放置），但遮罩本身持續顯示，只是解除點擊阻擋
// （.clickthrough）讓點按能穿透去放置直升機。
function updateOrientGuide() {
  if (window.arPlaced) {
    window.orientGuideOk = false;
    orientGuideEl.classList.add('hidden-guide');
    return;
  }
  orientGuideEl.classList.remove('hidden-guide'); // 長按重置放置後（arPlaced 重新變 false）讓遮罩自動重新出現

  const isLandscapeNow = document.body.classList.contains('landscape');
  const effBeta  = isLandscapeNow ? -cs.orientData.gamma : cs.orientData.beta;
  const effGamma = getStableRollDeg(isLandscapeNow);
  const betaErr  = effBeta - 90; // 目標：垂直朝上
  const gammaErr = effGamma;      // 目標：不左右歪斜

  const vRatio  = Math.max(-1, Math.min(1, betaErr / ORIENT_MAX_ERR_EDGE));
  const topPct  = 50 - vRatio * 45; // 45% 對應軌道上下邊緣，留一點邊界
  const rollDeg = Math.max(-ORIENT_MAX_ROLL_DEG, Math.min(ORIENT_MAX_ROLL_DEG, gammaErr));
  orientLineEl.style.top = topPct + '%';
  orientLineEl.style.transform = `translateY(-50%) rotate(${rollDeg}deg)`;

  const errorMag = Math.hypot(betaErr, gammaErr);
  const ok = errorMag <= ORIENT_GUIDE_TOL;
  window.orientGuideOk = ok;
  orientGuideEl.classList.toggle('ok', ok);
  orientGuideEl.classList.toggle('clickthrough', ok);
  orientGuideLabel.classList.toggle('ok', ok);
  orientGuideLabel.textContent = ok
    ? (window._xrActive ? '角度符合，請對準地板並點按螢幕放置' : '角度符合，準備完成')
    : '請將手機轉成垂直、螢幕面向自己';

  const offCenter = topPct - 50; // 正值：橫線偏下，需往上抬；負值：橫線偏上，需往下壓
  orientArrowUpEl.classList.toggle('active', !ok && offCenter > 4);
  orientArrowDownEl.classList.toggle('active', !ok && offCenter < -4);

  // 震動回饋：角度離符合越近震動越密集（類似轉盤/捲軸的碎震動），剛對齊瞬間給一次明顯雙震確認；
  // 僅 Android Chrome 支援 navigator.vibrate，iOS Safari 沒有此 API 時整段直接跳過、不影響其他功能
  if ('vibrate' in navigator) {
    if (ok && !orientGuideOkPrev) {
      navigator.vibrate([25, 40, 60]);
    } else if (!ok) {
      const now = Date.now();
      const errRatio = Math.min(1, Math.max(0, (errorMag - ORIENT_GUIDE_TOL) / (ORIENT_MAX_ERR_EDGE - ORIENT_GUIDE_TOL)));
      const tickInterval = HAPTIC_TICK_MIN_MS + errRatio * (HAPTIC_TICK_MAX_MS - HAPTIC_TICK_MIN_MS);
      if (now - lastHapticTick >= tickInterval) {
        navigator.vibrate(10);
        lastHapticTick = now;
      }
    }
  }
  orientGuideOkPrev = ok;
}

// ── 開啟手機後置鏡頭，作為背景顯示 ──────────────────────────
async function startCameraBackground() {
  // 8thWall AR 模式接管鏡頭時跳過 getUserMedia
  if (window.XR8) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    document.getElementById('camera-bg').srcObject = stream;
  } catch (e) {
    console.warn('無法開啟相機：', e.message);
  }
}

// ── 橫直模式 ──────────────────────────────────────────────
let isLandscape = false; // 預設直式

// ── 啟動（自動執行，不再顯示權限畫面）───────────────────────
async function startApp() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const r1 = await DeviceOrientationEvent.requestPermission();
      const r2 = await DeviceMotionEvent.requestPermission();
      if (r1 !== 'granted' || r2 !== 'granted') return false;
    } catch(e) {
      return false; // iOS 需要使用者手勢才能請求權限，等待第一次互動再重試
    }
  }
  resetOrientGuide();
  startSensors();
  startCameraBackground();
  show('screen-live');
  tryWakeLock();
  tryLockOrientation(isLandscape ? 'landscape-primary' : 'portrait-primary');
  requestAnimationFrame(updateJoyMax);
  startDisplayLoop();
  return true;
}

show('screen-live');
startApp().then(ok => {
  if (ok) return;
  // iOS 需要使用者手勢才能請求感測器權限：等待第一次點擊/觸碰後重試
  const retry = () => { startApp(); };
  document.addEventListener('click', retry, { once: true });
  document.addEventListener('touchstart', retry, { once: true });
});

// ── 感測器監聽 ────────────────────────────────────────────
function onOrientation(e) {
  cs.orientData.alpha = e.alpha || 0;
  cs.orientData.beta  = e.beta  || 0;
  cs.orientData.gamma = e.gamma || 0;
  if (cs.alphaOffset === null) cs.alphaOffset = cs.orientData.alpha;
  if (cs.betaOffset  === null) cs.betaOffset  = cs.orientData.beta;
  if (cs.gammaOffset === null) cs.gammaOffset = cs.orientData.gamma;
  hzCount++;
}
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (a) {
    cs.accelData.x = a.x || 0;
    cs.accelData.y = a.y || 0;
    cs.accelData.z = a.z || 0;
  }
}
function startSensors() {
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
}
function stopSensors() {
  window.removeEventListener('deviceorientation', onOrientation);
  window.removeEventListener('devicemotion', onMotion);
}

// ── 模擬搖桿 ──────────────────────────────────────────────
let joyDragging  = false;
let joyTouchId   = null; // 追蹤搖桿專屬的手指 ID
let JOY_MAX      = 62; // knob 最大位移 px，會在 updateJoyMax() 動態更新

const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');

function updateJoyMax() {
  const r = joyBase.getBoundingClientRect();
  const k = joyKnob.getBoundingClientRect();
  if (r.width > 0 && k.width > 0) JOY_MAX = Math.round((r.width / 2) - (k.width / 2) - 8);
}

async function tryLockOrientation(type) {
  try {
    if (screen.orientation && typeof screen.orientation.lock === 'function')
      await screen.orientation.lock(type);
  } catch(_) {}
}
function unlockOrientation() {
  try { if (screen.orientation?.unlock) screen.orientation.unlock(); } catch(_) {}
}

function joyMove(clientX, clientY) {
  const r  = joyBase.getBoundingClientRect();
  let dx   = clientX - (r.left + r.width  / 2);
  let dy   = clientY - (r.top  + r.height / 2);
  const d  = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  cs.joyH =  dx / JOY_MAX;
  cs.joyV = -dy / JOY_MAX; // 螢幕 Y 向下，遊戲前進向上，故取反
}

function joyReset() {
  joyKnob.classList.add('snap');
  joyKnob.style.transform = '';
  cs.joyH = 0; cs.joyV = 0; joyDragging = false; joyTouchId = null;
  setTimeout(() => joyKnob.classList.remove('snap'), 160);
}

// 觸控（用 identifier 追蹤搖桿那根手指，避免多點觸控干擾）
joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  if (joyTouchId !== null) return; // 已在追蹤，忽略額外的手指
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyDragging = true;
  joyMove(t.clientX, t.clientY);
}, { passive: false });

joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joyDragging) return;
  const t = Array.from(e.touches).find(t => t.identifier === joyTouchId);
  if (t) joyMove(t.clientX, t.clientY);
}, { passive: false });

joyBase.addEventListener('touchend', e => {
  e.preventDefault();
  if (Array.from(e.changedTouches).some(t => t.identifier === joyTouchId)) joyReset();
}, { passive: false });

joyBase.addEventListener('touchcancel', e => {
  e.preventDefault();
  if (Array.from(e.changedTouches).some(t => t.identifier === joyTouchId)) joyReset();
}, { passive: false });

// 滑鼠（桌機測試）
joyBase.addEventListener('mousedown', e => { joyDragging = true; joyMove(e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { if (joyDragging) joyMove(e.clientX, e.clientY); });
document.addEventListener('mouseup',   () => { if (joyDragging) joyReset(); });

// 鍵盤（WASD / 方向鍵）
const KEY_MAP   = { ArrowUp:'u',w:'u',W:'u', ArrowDown:'d',s:'d',S:'d', ArrowLeft:'l',a:'l',A:'l', ArrowRight:'r',d:'r',D:'r' };
const keyHeld   = new Set();
function applyKeys() {
  if (joyDragging) return;
  const h = (keyHeld.has('r')?1:0) - (keyHeld.has('l')?1:0);
  const v = (keyHeld.has('u')?1:0) - (keyHeld.has('d')?1:0);
  cs.joyH = h; cs.joyV = v;
  joyKnob.classList.remove('snap');
  joyKnob.style.transform = (h||v) ? `translate(${h*JOY_MAX}px,${-v*JOY_MAX}px)` : '';
}
document.addEventListener('keydown', e => { const k=KEY_MAP[e.key]; if(k){ keyHeld.add(k);    applyKeys(); e.preventDefault(); } });
document.addEventListener('keyup',   e => { const k=KEY_MAP[e.key]; if(k){ keyHeld.delete(k); applyKeys(); } });

// ── 抓取按鈕 ─────────────────────────────────────────────
const grabBtn = document.getElementById('grab-btn');

function setGrab(pressed) {
  cs.grabPressed = pressed;
  grabBtn.classList.toggle('pressed', pressed);
}

grabBtn.addEventListener('touchstart',  e => { e.preventDefault(); setGrab(true);  }, { passive: false });
grabBtn.addEventListener('touchend',    e => { e.preventDefault(); setGrab(false); }, { passive: false });
grabBtn.addEventListener('touchcancel', e => { e.preventDefault(); setGrab(false); }, { passive: false });
grabBtn.addEventListener('mousedown', () => setGrab(true));
document.addEventListener('mouseup',  () => { if (cs.grabPressed) setGrab(false); });

// ── 上升按鈕（按住持續上升，放開即停止施力，取代原本陀螺儀傾斜控制上下）────
const altBtn = document.getElementById('alt-btn');

function setAltUp(pressed) {
  cs.altUp = pressed;
  altBtn.classList.toggle('pressed', pressed);
}

altBtn.addEventListener('touchstart',  e => { e.preventDefault(); setAltUp(true);  }, { passive: false });
altBtn.addEventListener('touchend',    e => { e.preventDefault(); setAltUp(false); }, { passive: false });
altBtn.addEventListener('touchcancel', e => { e.preventDefault(); setAltUp(false); }, { passive: false });
altBtn.addEventListener('mousedown', () => setAltUp(true));
document.addEventListener('mouseup',  () => { if (cs.altUp) setAltUp(false); });

// ── 左右對調 ──────────────────────────────────────────────
let swapped = false;
document.getElementById('swap-btn').addEventListener('click', () => {
  swapped = !swapped;
  document.getElementById('controls-row').classList.toggle('swapped', swapped);
  document.getElementById('swap-btn').textContent = swapped ? '⇄ 還原位置' : '⇄ 左右對調';
});

// ── 即時數值顯示 ──────────────────────────────────────────
function startDisplayLoop() {
  hzCount = 0; lastHzTime = Date.now();
  hzInterval = setInterval(() => {
    const now = Date.now();
    const hz  = Math.round(hzCount * 1000 / (now - lastHzTime));
    document.getElementById('sb-hz').textContent = `頻率：${hz} Hz`;
    hzCount = 0; lastHzTime = now;
  }, 1000);

  displayInterval = setInterval(() => {
    updateOrientGuide();
    document.getElementById('sb-orient').textContent =
      `姿態：α${cs.orientData.alpha.toFixed(1)}° β${cs.orientData.beta.toFixed(1)}° γ${cs.orientData.gamma.toFixed(1)}°`;
    document.getElementById('sb-accel').textContent =
      `加速度：x${cs.accelData.x.toFixed(2)} y${cs.accelData.y.toFixed(2)} z${cs.accelData.z.toFixed(2)}`;
    document.getElementById('sb-joy').textContent =
      `搖桿：H${cs.joyH.toFixed(2)} V${cs.joyV.toFixed(2)}`;
    document.getElementById('sb-grab').textContent =
      `抓取：${cs.grabPressed ? '按下' : '放開'}`;
  }, 100);
}
function stopDisplayLoop() {
  clearInterval(displayInterval); displayInterval = null;
  clearInterval(hzInterval); hzInterval = null;
}

// ── Wake Lock（保持螢幕亮）────────────────────────────────
async function tryWakeLock() {
  try {
    if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
  } catch(_) {}
}

// ── 停止 ──────────────────────────────────────────────────
document.getElementById('disconnect-btn').addEventListener('click', () => {
  stopSensors();
  stopDisplayLoop();
  joyReset(); keyHeld.clear();
  setGrab(false);
  setAltUp(false);
  unlockOrientation();
  cs.alphaOffset = null;
  cs.betaOffset = null;
  cs.gammaOffset = null;
  startApp(); // 不再切回權限畫面，直接重新啟動感測器
});

// ── 橫直切換 ──────────────────────────────────────────────
document.getElementById('orient-btn').addEventListener('click', () => {
  isLandscape = !isLandscape;
  document.body.classList.toggle('landscape', isLandscape);
  document.getElementById('orient-btn').textContent = isLandscape ? '切換直式' : '切換橫式';
  tryLockOrientation(isLandscape ? 'landscape-primary' : 'portrait-primary');
  requestAnimationFrame(updateJoyMax);
});

<!-- ── 3D 直升機模型：搖桿控制水平位置、上升按鈕控制垂直位置（陀螺儀控制角度/方向預設關閉） ── -->
<script type="importmap">
{
  "imports": {

    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const wrap = document.getElementById('three-wrap');
const state = window.controlState;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 4, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.autoClear = false; // 8thWall AR 模式：防止每幀自動清除 GL 緩衝（會蓋掉相機畫面）
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(3, 5, 2);
scene.add(dirLight);

// ── 1€ Filter（自適應低通濾波）───────────────────────────────
// 用於 8thWall SLAM camera pose／reticle 地板命中位置：這類 AR 追蹤資料靜止時雜訊要濾得重，
// 但鏡頭／手快速移動時又要幾乎即時跟上，固定係數的 lerp 沒辦法兩者兼顧（太輕壓不掉手震，
// 太重會讓內容明顯「跟不上」畫面，鏡頭快速移動時尤其明顯）。
// 1€ Filter（Casiez et al. 2012）依訊號變化速度動態調整截止頻率：慢動作時濾波器變「重」，
// 快動作時自動變「輕」。minCutoff 控制靜止時的濾波強度（越小越重），beta 控制速度對濾波的
// 削弱程度（越大，快速移動時濾波介入越少）。
class OneEuroFilter1D {
  constructor(minCutoff, beta, dCutoff = 1.0) {
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
  static alpha(te, cutoff) {
    const r = 2 * Math.PI * cutoff * te;
    return r / (r + 1);
  }
  filter(x, t) {
    if (this.tPrev === null) {
      this.tPrev = t;
      this.xPrev = x;
      return x;
    }
    const te = Math.max(t - this.tPrev, 1e-3); // 避免同一幀內 dt=0 導致除以 0
    const dx = (x - this.xPrev) / te;
    const aD = OneEuroFilter1D.alpha(te, this.dCutoff);
    const dxHat = this.dxPrev + aD * (dx - this.dxPrev);
    const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
    const a = OneEuroFilter1D.alpha(te, cutoff);
    const xHat = this.xPrev + a * (x - this.xPrev);
    this.tPrev = t;
    this.xPrev = xHat;
    this.dxPrev = dxHat;
    return xHat;
  }
  reset() {
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
}

// Vector3／Quaternion 版本：內部各分量各自套一顆 1D 濾波器。四元數濾完各分量後需要重新
// 正規化，小角度雜訊下這個近似誤差可忽略不計，是 AR 追蹤濾波的常見做法。
class Vector3OneEuroFilter {
  constructor(minCutoff, beta) {
    this.fx = new OneEuroFilter1D(minCutoff, beta);
    this.fy = new OneEuroFilter1D(minCutoff, beta);
    this.fz = new OneEuroFilter1D(minCutoff, beta);
  }
  filter(v, t, out = v) {
    return out.set(this.fx.filter(v.x, t), this.fy.filter(v.y, t), this.fz.filter(v.z, t));
  }
  reset() { this.fx.reset(); this.fy.reset(); this.fz.reset(); }
}
class QuaternionOneEuroFilter {
  constructor(minCutoff, beta) {
    this.fx = new OneEuroFilter1D(minCutoff, beta);
    this.fy = new OneEuroFilter1D(minCutoff, beta);
    this.fz = new OneEuroFilter1D(minCutoff, beta);
    this.fw = new OneEuroFilter1D(minCutoff, beta);
    this._lastRaw = null; // q 與 -q 是同一個旋轉，但濾波器不能直接混，需偵測正負號翻轉並校正
  }
  filter(q, t, out = q) {
    let { x, y, z, w } = q;
    if (this._lastRaw && (x * this._lastRaw.x + y * this._lastRaw.y + z * this._lastRaw.z + w * this._lastRaw.w) < 0) {
      x = -x; y = -y; z = -z; w = -w;
    }
    this._lastRaw = { x, y, z, w };
    out.set(this.fx.filter(x, t), this.fy.filter(y, t), this.fz.filter(z, t), this.fw.filter(w, t));
    return out.normalize();
  }
  reset() { this.fx.reset(); this.fy.reset(); this.fz.reset(); this.fw.reset(); this._lastRaw = null; }
}

// camera pose 濾波：修正「鏡頭移動時直升機微幅亂飄」——原本每幀直接套用 SLAM 原始 pose，
// 追蹤雜訊會直接反映成畫面抖動。數值是初始估計，待實機微調。
const cameraPosFilter = new Vector3OneEuroFilter(0.8, 0.3);
const cameraQuatFilter = new QuaternionOneEuroFilter(0.8, 0.4);
const _rawCamPos = new THREE.Vector3();
const _rawCamQuat = new THREE.Quaternion();

// ── AR 地板偵測：錨點與 Reticle ────────────────────────────
let arAnchorPos = new THREE.Vector3(0, 0, 0);
let arPlaced = false;
window.arPlaced = false; // 同步給姿態引導遮罩讀取（不同 script 作用域）
// 定位後是否已經開始手動操作（搖桿或上升按鈕）：在此之前直升機完全靜止黏在地面/桌面上，
// 不會像正常飛行中放開上升按鈕那樣緩慢下沉，避免一放置就自己往下沉穿出地板
let hasStartedMoving = false;

// Ring 幾何體用「外半徑 1」的單位圓建立，實際外半徑由 reticle.scale／placementMarker.scale
// 即時控制（見 updateReticleFootprint），讓圈圈大小能跟著直升機實際佔地大小走，
// 不是寫死的固定半徑（見下方 chopperFootprintUnit 的說明）
const RETICLE_DEFAULT_RADIUS = 0.12; // 模型尚未載入完成前的預設外半徑（公尺），每幀由 updateReticleFootprint() 覆寫

const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide });
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.667, 1, 32).rotateX(-Math.PI / 2),
  reticleMat
);
reticle.visible = false;
reticle.scale.setScalar(RETICLE_DEFAULT_RADIUS);
scene.add(reticle);

// 桌機測試用「定位點」標記：沒有相機/AR 時，直接在地面畫一個綠色圈圈代表放置位置，
// 直升機定高懸停在上方，不會像手機端那樣放開按鈕就緩慢下沉（見 window._holdAltitude）
const placementMarkerMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
const placementMarker = new THREE.Mesh(
  new THREE.RingGeometry(0.786, 1, 48).rotateX(-Math.PI / 2),
  placementMarkerMat
);
placementMarker.visible = false;
placementMarker.scale.setScalar(RETICLE_DEFAULT_RADIUS);
scene.add(placementMarker);

// 偵測平面視覺參考：半透明填色平面＋網格線，純粹讓使用者更容易判斷偵測到的是哪個平面

// hitTest 只給單點命中結果＋法向量，沒有平面幾何/邊界資料，所以尺寸是固定倍率的示意值
const RETICLE_PLANE_MULTIPLIER = 4; // 平面／網格參考範圍 = reticle 外半徑 × 這個倍數
const reticlePlaneFillMat = new THREE.MeshBasicMaterial({
  color: 0xffaa00, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false,
});
const reticlePlaneFill = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  reticlePlaneFillMat
);
// GridHelper 預設用頂點色畫出中心線／格線兩種顏色，關掉 vertexColors 改用 material.color，
// 才能跟 reticle 一樣依穩定度即時切換整體顏色（橘→綠）
const reticleGridHelper = new THREE.GridHelper(1, 12, 0xffaa00, 0xffaa00);
reticleGridHelper.material.vertexColors = false;
reticleGridHelper.material.transparent = true;
reticleGridHelper.material.opacity = 0.35;
reticleGridHelper.material.depthWrite = false;

const reticlePlane = new THREE.Group();
reticlePlane.add(reticlePlaneFill, reticleGridHelper);
reticlePlane.visible = false;
scene.add(reticlePlane);

// 地板偵測穩定度判斷：hit-test 結果距離越遠雜訊越大，單幀結果可能忽高忽低，
// 需連續多幀的偵測結果都落在容許誤差內（且用平滑後的位置）才允許放置，避免飛機懸空或陷地
// 綠/黃兩色改用「進入」跟「離開」兩套不同門檻（類似施密特觸發器）：要變綠比較嚴格，
// 但一旦變綠、除非明顯超出更寬鬆的門檻且連續很多幀，否則不會馬上跳回黃色，避免卡在
// 邊緣時來回橫跳、來不及在綠色的瞬間點下去
// hit-test 是對螢幕正中央打一條線找地板，手機稍微傾斜／手震都會讓瞄準點跟著移動，
// 這是正常生理性手震的等級，不代表偵測失敗；門檻放寬到能容忍一般手持狀態下的晃動，
// 讓變綠不再需要「完全靜止」才能達成，同時仍保留一定的穩定度要求避免放置位置亂飄
const RETICLE_STABLE_FRAMES     = 8;    // 需連續納入判斷的幀數
const RETICLE_STABLE_TOL        = 0.035; // 進入穩定（變綠）的容許誤差（公尺）
const RETICLE_STABLE_TOL_EXIT   = 0.07;  // 已穩定時，要超過這個更寬鬆的誤差才算「可能不穩定」
const RETICLE_UNSTABLE_GRACE    = 4;    // 已穩定時，需連續這麼多幀都超過寬鬆誤差，才真的跳回不穩定
// 瞄準地板時的手震噪聲比走動時的鏡頭雜訊更明顯（幾乎靜止對準），濾得比 camera pose 更重一點；
// 這同時修正「定位圓圈/網格經常高頻縮放」——圈圈實際半徑固定，縮放閃爍是命中位置沿鏡頭
// 深度軸跳動、透視投影放大成視覺大小忽大忽小，位置濾得更穩，縮放閃爍會一併改善。
const reticlePosFilter = new Vector3OneEuroFilter(0.5, 0.3);
const reticleRotFilter = new QuaternionOneEuroFilter(0.5, 0.3);
const _hitPosTmp = new THREE.Vector3();
const _hitRotTmp = new THREE.Quaternion();
const reticleHistory = [];
const reticleSmoothed = new THREE.Vector3();
// 表面角度（貼合實際偵測到的傾斜方向，例如桌緣、斜面），沒有 rotation 資料時維持單位四元數
// （對應 reticle/reticlePlane 幾何原本 rotateX(-90°) 烘焙的水平朝向，向下相容舊行為）
const reticleSmoothedQuat = new THREE.Quaternion();
let reticleStable = false;
let reticleUnstableStreak = 0;

function resetReticleStability() {
  reticleHistory.length = 0;
  reticleStable = false;
  reticleUnstableStreak = 0;
  reticlePosFilter.reset();
  reticleRotFilter.reset();
}

// 搖桿可移動的範圍（世界座標單位）
// 即時數值由「偵錯面板」的移動範圍滑桿控制（window.moveRangeDebug）
const POS_RANGE_X = 2.0; // 左右（城市場景縮放計算用，固定初始值）
const POS_RANGE_Z = 3.6; // 前後（城市場景縮放計算用，固定初始值）
const moveRangeDebug = window.moveRangeDebug;

// 直升機初始位置（即時調整，疊加在搖桿移動範圍之外）
const chopperPosDebug = window.chopperPosDebug;
// 機身旋轉中心偏移（即時調整，相對模型幾何中心位移旋轉軸心）
const chopperPivotDebug = window.chopperPivotDebug;
// 箭頭（拉力錨點）沿飛行方向前移的距離（即時調整）
const chopperArrowOffsetDebug = window.chopperArrowOffsetDebug;
// 機身被箭頭拉著走的彈簧-阻尼參數（即時調整，x/y/z 共用）
const chopperLeashDebug = window.chopperLeashDebug;
// 機身上升／下沉時額外疊加的垂直回彈參數（即時調整，僅套用在 y 軸的獨立回彈層）
const chopperVertLeashDebug = window.chopperVertLeashDebug;
// 機身上升／下沉時額外疊加的角度回彈參數（即時調整，僅套用在俯仰角的獨立回彈層）
const chopperPitchRecoilDebug = window.chopperPitchRecoilDebug;
const movePos = new THREE.Vector3(0, 0, 0); // 飛行範圍內的相對位置（不含初始位置偏移）

const MAX_SPEED  = 1.0;  // 最大移動速度（單位／秒，搖桿水平移動用；以下方 SPEED_SCALE_REF 對應的機身縮放為基準調校）
const ACCEL      = 10;   // 推搖桿時的加速反應速度（時間常數，不隨機身縮放調整）
// 上面這些移動速度常數是在「飛機縮放」偵錯滑桿預設值 1.2 下調校出來的手感；只要機身縮放
// （chopperDebug.scale，例如進 AR 後改用的 window.AR_DEFAULT_SCALE）跟這個基準不同，
// 若移動速度不跟著等比例縮小，縮小後的機身相對自己的體型會飛得快很多（同樣 1 單位/秒，
// 體長縮小 N 倍等於相對體長的速度快了 N 倍）。
// moveSpeedScale 把速度換算成跟機身目前實際縮放同比例，讓「每秒飛幾個機身長度」維持一致。
const SPEED_SCALE_REF = 1.2; // 上面速度常數調校時對應的 chopperDebug.scale 基準值
const DAMPING    = 3;    // 放開搖桿後的減速阻尼（越大停得越快）

// 轉向用彈簧-阻尼（而非按比例直接逼近角度）：角速度從 0 開始逐漸加速轉起來，接近目標朝向
// 時再減速停下，比「瞬間就有最大角速度、然後線性衰減」多一點「轉起來要花力氣」的重量感。
// stiffness 越大轉得越快／越有力，damping 需大於等於臨界阻尼（2*sqrt(stiffness)）才不會轉過頭來回擺盪
const HEADING_SPRING_STIFFNESS = 30;
const HEADING_SPRING_DAMPING   = 12;

// 上升按鈕控制垂直移動（取代原本陀螺儀傾斜控制上下），參考 Flappy Bird 的單鍵操作，
// 但加速/減速都改用較慢的反應速度，讓阻尼與施力的持續感更強，不會像 Flappy Bird 那樣一觸即發、忽上忽下
const VERT_UP_SPEED   = 1.4;  // 按住上升按鈕時的目標上升速度
const VERT_UP_ACCEL   = 4;    // 上升時速度逼近目標的反應速度（比水平 ACCEL 慢，手感更沉重扎實）
const VERT_FALL_SPEED = -0.5; // 放開按鈕後的緩慢下沉目標速度（模擬重力，但比 Flappy Bird 溫和許多）
const VERT_FALL_ACCEL = 1.2;  // 下沉時速度逼近目標的反應速度（更慢，讓上升的衝勁能持續久一點才轉為下沉）

// 垂直/角度回彈（甩動反作用力視覺效果）暫時關閉：上升／移動時機身應保持水平，
// 之後如果要恢復甩動手感，把這個改回 true 即可，不需要動下面的彈簧-阻尼參數
const RECOIL_ENABLED = false;

// 機身旋轉偏移量（度），即時數值由「偵錯面板」的旋轉滑桿控制（window.chopperRotDebug）
// 預設 Y=-90 對應原本寫死的 BASE_YAW：模型靜止時面向 -X，偏移後改為面向正前方（畫面內側 -Z）
const chopperRotDebug = window.chopperRotDebug;

// 相機跟隨直升機的相對偏移量（世界座標，不隨機頭轉向旋轉）
// 即時數值由畫面上的「相機偵錯面板」滑桿控制（window.cameraDebug）
const camDebug = window.cameraDebug;

const velocity = new THREE.Vector3(0, 0, 0); // 飛行速度（世界座標 x, y, z）

// 「搖桿方向座標系」：起飛時校正一次，之後隨機身姿態變化（deltaQuat）一起旋轉，
// 讓搖桿的前後左右會隨陀螺儀傾斜而轉向（包含上下），但唯有搖桿輸入才會產生速度。
let initialDeviceQuat = null;
let initialDeviceQuatInv = null;
const deltaQuat = new THREE.Quaternion();
const FORWARD_AXIS = new THREE.Vector3(0, 0, -1); // 對應搖桿 V（前推）
const RIGHT_AXIS   = new THREE.Vector3(1, 0, 0);  // 對應搖桿 H（右推）
const flightForward = new THREE.Vector3();
const flightRight   = new THREE.Vector3();
const flightForwardXZ = new THREE.Vector3(); // flightForward 在水平面的投影（搖桿前後方向）
const flightRightXZ   = new THREE.Vector3(); // flightRight 在水平面的投影（搖桿左右方向）
const targetVel      = new THREE.Vector3();
const headingArrowDir = new THREE.Vector3(0, 0, -1); // 搖桿指向的目標朝向（未經轉向阻尼）
const currentHeadingDir = new THREE.Vector3(0, 0, -1); // 機頭目前實際朝向的水平單位向量（由 currentHeadingYaw 換算），
                                                        // 飛行速度方向與拉力錨點前移方向都以這個「目前朝向」為準，不是搖桿方向
const corePos  = new THREE.Vector3(); // 拉力錨點的邏輯中心（移動範圍中心 + AR 地板錨點）
const arrowPos = new THREE.Vector3(); // 箭頭實際位置＝corePos 沿飛行方向前移後的位置
const chopperVisualPos = new THREE.Vector3(); // 機身「被拉著走」的實際顯示位置（落後於箭頭）
const chopperVisualVel = new THREE.Vector3(); // 機身視覺位置的慣性速度
const leashAccel = new THREE.Vector3(); // 彈簧-阻尼系統暫存加速度
let chopperVisualInit = false; // 是否已初始化機身視覺位置（避免第一幀從原點飛過來）
let recoilOffsetY = 0; // 垂直回彈層的位移（疊加在 chopper.position.y 上，純視覺效果）
let recoilVelY = 0;    // 垂直回彈層的速度
let prevVelYPos = 0;   // 上一幀的垂直飛行速度，用來偵測「速度變化」以觸發垂直位移回彈衝量
let pitchRecoilOffset = 0; // 角度回彈層的俯仰角（弧度），直接加進 headingEuler 的俯仰軸一起套用，
                            // 避免另外用四元數疊加時落在模型未校正的原始網格軸上而看起來不像單純俯仰
let pitchRecoilVel = 0;    // 角度回彈層的角速度
let prevVelY = 0;          // 上一幀的垂直飛行速度，用來偵測「速度變化」以觸發回彈衝量
// 機身目前的水平朝向角（yaw，弧度）：飛機式操控——搖桿只決定「目標朝向」，機頭用彈簧-阻尼
// 逐漸轉過去（見上方 HEADING_SPRING_STIFFNESS/DAMPING），不是瞬間對齊；油門大小連續地跟著
// 對齊程度走（見下方 alignmentFactor），移動方向永遠沿這個「目前朝向」推進，不是沿搖桿方向
let currentHeadingYaw = 0;
let headingYawVel = 0; // 機頭朝向角的角速度（弧度／秒），轉向彈簧-阻尼的狀態量

// 上升傾角：按住上升按鈕時機頭逐漸上仰（最多 35 度），放開後逐漸校正回水平；
// 除了按著上升按鈕以外的所有狀態（移動、下沉、靜止）機頭一律維持水平——機身朝向只由
// currentHeadingYaw（水平朝向角）決定，不含俯仰分量，上仰完全獨立由這層疊加
const ASCEND_PITCH_MAX  = THREE.MathUtils.degToRad(35); // 上仰角上限
const ASCEND_PITCH_RATE = 4; // 逼近目標角度的反應速度（上仰／回正共用）
let ascendPitch = 0; // 目前上升傾角（弧度）

const headingQuat = new THREE.Quaternion(); // 機身顯示朝向：對齊朝向指示棒方向
const headingEuler = new THREE.Euler();
const UP_AXIS = new THREE.Vector3(0, 1, 0);

// 朝向指示棒：顯示目前搖桿輸入會飛去的實際方向（無輸入時顯示機身前方）
const HEADING_ARROW_LENGTH = 1;
const headingArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0, 0), HEADING_ARROW_LENGTH, 0xffcc00, 0.8, 0.4);
headingArrow.visible = false; // 隱藏朝向指示棒
scene.add(headingArrow);

// 速度逐步逼近目標值：目標非零時用 ACCEL（加速），目標為零時用 DAMPING（減速阻尼）
function approachValue(current, target, delta) {
  if (target !== 0) {
    const k = Math.min(1, ACCEL * delta);
    return current + (target - current) * k;
  }
  const damp = Math.max(0, 1 - DAMPING * delta);
  return current * damp;
}

// ── 陀螺儀 → 四元數姿態 ────────────────────────────────────
// 採用 three.js DeviceOrientationControls 的標準作法：
// Euler('YXZ') 對應 (beta→X 俯仰, alpha→Y 朝向/yaw, -gamma→Z 橫滾)，
// 再乘上「裝置座標系（Z 朝上）→ three.js 座標系（Y 朝上）」的固定校正（繞 X 軸 -90 度）
const DEVICE_TO_THREE = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const deviceEuler = new THREE.Euler();
const deviceQuat = new THREE.Quaternion();
// 機身旋轉偏移量（由偵錯面板的 X/Y/Z 滑桿即時調整）
const offsetEuler = new THREE.Euler();
const offsetQuat = new THREE.Quaternion();

// 城市街景場景，當作地面（取代原本的 GridHelper）
// 即時縮放／位置／角度由「偵錯面板」的城市相關滑桿控制（window.cityDebug）
const cityDebug = window.cityDebug;
let cityObj = null, cityBaseScale = 1, cityCenter = null, cityMinY = 0;

function applyCityTransform() {
  if (!cityObj) return;
  const s = cityBaseScale * cityDebug.scale;
  cityObj.scale.setScalar(s);
  cityObj.position.x = -cityCenter.x * s + cityDebug.x;
  cityObj.position.z = -cityCenter.z * s + cityDebug.z;
  cityObj.position.y = -cityMinY * s + cityDebug.y;
  cityObj.rotation.y = THREE.MathUtils.degToRad(cityDebug.rot);
}

new GLTFLoader().load('city-street_free_for_game.glb', gltf => {
  const obj = gltf.scene;

  // 基礎縮放：讓場景的水平範圍略大於可移動範圍，留一點邊界緩衝
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const targetSize = Math.max(POS_RANGE_X, POS_RANGE_Z) * 2 * 1.5 * 3;

  cityBaseScale = targetSize / Math.max(size.x, size.z);
  cityCenter = box.getCenter(new THREE.Vector3());
  cityMinY = box.min.y;
  cityObj = obj;
  applyCityTransform();

  obj.visible = false;
  scene.add(obj);
});

// 即時縮放倍率由「偵錯面板」的飛機縮放滑桿控制（window.chopperDebug）
const chopperDebug = window.chopperDebug;
let chopperModel = null, chopperBaseScale = 1;
let chopperBasePos = null;
// 直升機模型 X/Z 方向的「半徑」（模型原始單位，尚未套用 chopperBaseScale／縮放滑桿），
// 用來讓地板定位圈即時換算成跟機身實際佔地大小一致的半徑（見 updateReticleFootprint）
let chopperFootprintUnit = 0;

let chopper = null;
let mixer = null;
// 是否已經確定可以顯示機身：非 AR 模式一開始就是 true；AR 模式要等放置完成才會是 true，
// 避免模型還沒放置就已經出現在畫面上（見 applyChopperVisibility 的呼叫點）
let chopperShouldBeVisible = false;
function applyChopperVisibility() {
  if (chopper) chopper.visible = chopperShouldBeVisible;
}
new GLTFLoader().load('low_poly_helicopter.glb', gltf => {
  const obj = gltf.scene;

  // 置中並縮放到固定大小
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  chopperBasePos = obj.position.clone(); // 模型置中後的基準位置，旋轉中心偏移以此為基準
  chopperBaseScale = 2.6 / Math.max(size.x, size.y, size.z);

  // 佔地半徑不能直接用模型「原始未旋轉」座標的 X/Z 包圍盒：實際顯示時 chopper 群組會套用
  // chopperRotDebug 這組掛載旋轉（預設 -168/-90/-168 度，幅度很大），模型在畫面上的姿態
  // 跟原始檔案座標差很多，導致圈圈大小（用原始 X/Z 算）跟畫面上實際看到的機身佔地兜不起來。
  // 改成把置中後包圍盒的 8 個角點套用同一組掛載旋轉，取旋轉後在水平面（XZ）離中心最遠的
  // 距離，才是畫面上真正看得到的佔地半徑；之後的機頭朝向（yaw）只在水平面繞著轉，半徑不變。
  const footprintQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
    THREE.MathUtils.degToRad(chopperRotDebug.x),
    THREE.MathUtils.degToRad(chopperRotDebug.y),
    THREE.MathUtils.degToRad(chopperRotDebug.z)
  ));
  const halfSize = size.clone().multiplyScalar(0.5);
  let maxAbsX = 0, maxAbsZ = 0;
  const corner = new THREE.Vector3();
  [-1, 1].forEach(sx => [-1, 1].forEach(sy => [-1, 1].forEach(sz => {
    corner.set(sx * halfSize.x, sy * halfSize.y, sz * halfSize.z).applyQuaternion(footprintQuat);
    maxAbsX = Math.max(maxAbsX, Math.abs(corner.x));
    maxAbsZ = Math.max(maxAbsZ, Math.abs(corner.z));
  })));
  // 用個別軸向的最大延伸（而非對角線距離）取較大者，對應原本「max(size.x,size.z)/2」的
  // 單軸半徑定義，避免用對角線距離導致算出來的半徑比實際單軸延伸大一圈
  chopperFootprintUnit = Math.max(maxAbsX, maxAbsZ); // 掛載旋轉後的 X/Z 佔地半徑（模型原始單位）
  chopperModel = obj;
  obj.scale.setScalar(chopperBaseScale * chopperDebug.scale);

  chopper = new THREE.Group();
  chopper.add(obj);
  scene.add(chopper);
  applyChopperVisibility(); // 套用目前已知的顯示狀態（AR 模式且尚未放置時維持隱藏）

  // 播放模型內建動畫（例如旋翼自轉）
  if (gltf.animations && gltf.animations.length) {
    mixer = new THREE.AnimationMixer(obj);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }
});

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

// AR 模式（reticle）用「chopperDebug.scale × 偵錯面板可調比例」算半徑，不再從模型包圍盒
// 推算：包圍盒只是粗略估計，模型形狀不規則（例如旋翼／機尾伸出去的部分）時跟實機看到的
// 視覺大小會兜不起來。改成跟機身縮放等比例連動後，圈圈會跟著「縮放」滑桿一起變化，不用
// 兩邊分開調，比例常數本身仍可在偵錯面板微調視覺對齊。
// 桌機測試用的 placementMarker 沒有實機大小可以比對，繼續沿用模型包圍盒推算的舊邏輯即可。
function updateReticleFootprint() {
  const modelR = chopperFootprintUnit > 0
    ? chopperFootprintUnit * chopperBaseScale * chopperDebug.scale
    : RETICLE_DEFAULT_RADIUS;
  reticle.scale.setScalar(window._xrActive ? chopperDebug.scale * window.arReticleRadiusDebug.ratio : modelR);
  placementMarker.scale.setScalar(modelR);
  reticlePlane.scale.setScalar(reticle.scale.x * RETICLE_PLANE_MULTIPLIER);
}

const clock = new THREE.Clock();
function animate() {
  // requestAnimationFrame 由 8thWall pipeline 的 onRender 驅動，此處不自行呼叫
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  applyCityTransform();
  updateReticleFootprint();
  if (chopperModel) {
    chopperModel.scale.setScalar(chopperBaseScale * chopperDebug.scale);
    // 旋轉中心偏移：模型相對 chopper 群組原點（旋轉軸心）反向位移，等效於把旋轉軸心移到偏移處
    chopperModel.position.set(
      chopperBasePos.x - chopperPivotDebug.x,
      chopperBasePos.y - chopperPivotDebug.y,
      chopperBasePos.z - chopperPivotDebug.z
    );
  }
  // AR 模式且尚未放置時，機身完全靜止（不累積速度／位移），避免放置前就在畫面裡飄動；
  // 非 AR 模式沒有放置流程，維持原本一開始就能飛行的行為
  if (chopper && (!window._xrActive || arPlaced)) {
    // 陀螺儀 → 機身姿態（俯仰／橫滾／朝向），橫式持握時 beta/gamma 互換校正
    const isLandscapeNow = document.body.classList.contains('landscape');
    const effBeta  = isLandscapeNow ? -state.orientData.gamma : state.orientData.beta;
    const effGamma = isLandscapeNow ?  state.orientData.beta  : state.orientData.gamma;
    const alphaRel = state.orientData.alpha - (state.alphaOffset ?? state.orientData.alpha);
    deviceEuler.set(
      THREE.MathUtils.degToRad(effBeta),
      THREE.MathUtils.degToRad(alphaRel),
      THREE.MathUtils.degToRad(-effGamma),
      'YXZ'
    );
    deviceQuat.setFromEuler(deviceEuler).multiply(DEVICE_TO_THREE);
    offsetEuler.set(
      THREE.MathUtils.degToRad(chopperRotDebug.x),
      THREE.MathUtils.degToRad(chopperRotDebug.y),
      THREE.MathUtils.degToRad(chopperRotDebug.z)
    );
    offsetQuat.setFromEuler(offsetEuler);

    // 校正「搖桿方向座標系」的基準姿態（開始感測器當下，alphaRel=0 的那一刻）
    if (state.alphaOffset === null) {
      initialDeviceQuat = null;
      initialDeviceQuatInv = null;
    } else if (initialDeviceQuat === null) {
      initialDeviceQuat = deviceQuat.clone();
      initialDeviceQuatInv = initialDeviceQuat.clone().invert();
    }

    // 機身姿態相對於起飛時的變化量：讓搖桿前後左右的方向跟著機身傾斜旋轉。
    // 由 window.gyroControlEnabled 開關控制（預設關閉，可在偵錯面板即時開啟）；
    // 關閉時搖桿方向固定不受手機傾斜影響，尚未校正（無陀螺儀資料）時同樣維持單位旋轉，
    // 避免 DEVICE_TO_THREE 的固定校正把方向轉去 Y 軸
    if (window.gyroControlEnabled && initialDeviceQuatInv) {
      deltaQuat.copy(deviceQuat).multiply(initialDeviceQuatInv);
    } else {
      deltaQuat.identity();
    }

    flightForward.copy(FORWARD_AXIS).applyQuaternion(deltaQuat);
    flightRight.copy(RIGHT_AXIS).applyQuaternion(deltaQuat);

    // 水平移動方向：取 flightForward / flightRight 在水平面（XZ）的投影，
    // 傾斜角度過大導致某一軸投影接近 0 時，用另一軸的水平投影推導（互相垂直）
    flightForwardXZ.set(flightForward.x, 0, flightForward.z);
    flightRightXZ.set(flightRight.x, 0, flightRight.z);
    if (flightForwardXZ.lengthSq() < 1e-6) flightForwardXZ.crossVectors(UP_AXIS, flightRightXZ);
    if (flightRightXZ.lengthSq()   < 1e-6) flightRightXZ.crossVectors(flightForwardXZ, UP_AXIS);
    flightForwardXZ.normalize();
    flightRightXZ.normalize();

    // 上下移動：按住「上升」按鈕才上升，放開後緩慢下沉（類似 Flappy Bird 的單鍵操作，
    // 但上升/下沉都用較慢的反應速度逼近目標速度，阻尼與施力的持續感更強）
    // 搖桿是否有水平輸入（下面判斷「是否已開始手動操作」與「是否更新目標朝向」都會用到）
    const joyActive = (state.joyH * state.joyH + state.joyV * state.joyV) > 1e-4;

    // 移動速度隨機身目前實際縮放等比例換算（見 SPEED_SCALE_REF 說明），維持「每秒飛幾個機身長度」的手感一致
    const moveSpeedScale = chopperDebug.scale / SPEED_SCALE_REF;
    const maxSpeed     = MAX_SPEED * moveSpeedScale;
    const vertUpSpeed  = VERT_UP_SPEED * moveSpeedScale;
    const vertFallSpeed = VERT_FALL_SPEED * moveSpeedScale;

    // 定位後、手動操作（搖桿或上升按鈕）開始之前，強制目標速度為 0，直升機黏在地面/桌面上不動，
    // 避免放置瞬間就因為預設的下沉目標速度而自己往下滑
    if (state.altUp || joyActive) hasStartedMoving = true;
    const vertTarget = state.altUp ? vertUpSpeed : ((window._holdAltitude || !hasStartedMoving) ? 0 : vertFallSpeed);
    const vertAccel  = state.altUp ? VERT_UP_ACCEL : VERT_FALL_ACCEL;

    // 搖桿輸入（H=左右、V=前後）先算出「目標朝向」與「油門大小」，還不是實際移動方向：
    // 飛機式操控下，搖桿決定機頭應該轉去哪、以及推進力道，實際飛行方向永遠沿目前機頭朝向
    targetVel.copy(flightRightXZ).multiplyScalar(state.joyH)
      .addScaledVector(flightForwardXZ, state.joyV)
      .multiplyScalar(maxSpeed);
    targetVel.y = vertTarget;

    // 更新目標朝向：只在搖桿有水平輸入時才更新，且只取水平分量（垂直的上升/下沉
    // 完全不影響朝向，機身俯仰角改由下方的「上升傾角」獨立控制）；
    // 沒有水平輸入時維持上一次的目標朝向不變，機頭不會因放開搖桿而回正
    const horizVelLengthSq = targetVel.x * targetVel.x + targetVel.z * targetVel.z;
    if (joyActive && horizVelLengthSq > 1e-6) {
      headingArrowDir.set(targetVel.x, 0, targetVel.z).normalize();
    }
    headingArrow.setDirection(headingArrowDir);

    // 機頭朝向用彈簧-阻尼逼近目標朝向（先轉向）：角速度從 0 開始逐漸加速轉起來，接近目標時
    // 再減速停下，比單純按比例逼近角度多一點「轉起來要花力氣」的重量感。用最短路徑角度差，
    // 避免從 -179 度轉到 +179 度時繞遠路轉一大圈。
    const targetHeadingYaw = Math.atan2(-headingArrowDir.x, -headingArrowDir.z);
    let headingYawDelta = targetHeadingYaw - currentHeadingYaw;
    headingYawDelta = THREE.MathUtils.euclideanModulo(headingYawDelta + Math.PI, Math.PI * 2) - Math.PI;
    const headingYawAccel = headingYawDelta * HEADING_SPRING_STIFFNESS - headingYawVel * HEADING_SPRING_DAMPING;
    headingYawVel += headingYawAccel * delta;
    currentHeadingYaw += headingYawVel * delta;
    currentHeadingDir.set(-Math.sin(currentHeadingYaw), 0, -Math.cos(currentHeadingYaw));

    // 油門大小連續地跟著「機頭朝向對齊程度」走，不設門檻、不分兩段：誤差還很大（剛開始轉、
    // 或大角度轉彎）時油門接近 0，機身幾乎只轉不動；誤差越縮小油門越自然升高，轉到位時油門
    // 剛好接近全開。轉向跟出發因此是同一條連續曲線，不會有「轉完→停頓→再起步」的分段感。
    // cos(誤差) 是最貼近「推力沿目前朝向的有效分量」的物理量：誤差 90 度以上完全不出力。
    const headingErrAbs = Math.abs(headingYawDelta);
    const alignmentFactor = Math.max(0, Math.cos(headingErrAbs));
    const throttle = alignmentFactor * Math.min(1, Math.hypot(state.joyH, state.joyV));
    targetVel.x = currentHeadingDir.x * throttle * maxSpeed;
    targetVel.z = currentHeadingDir.z * throttle * maxSpeed;

    velocity.x = approachValue(velocity.x, targetVel.x, delta);
    velocity.y += (targetVel.y - velocity.y) * Math.min(1, vertAccel * delta);
    velocity.z = approachValue(velocity.z, targetVel.z, delta);

    const nextX = movePos.x + velocity.x * delta;
    const nextY = movePos.y + velocity.y * delta;
    const nextZ = movePos.z + velocity.z * delta;
    movePos.x = THREE.MathUtils.clamp(nextX, -moveRangeDebug.x, moveRangeDebug.x);
    // 下限固定為 0（不可低於）：0 對應定位當下的地面/桌面高度（arAnchorPos.y），
    // 避免下降時穿過原本定位的地面/桌面
    movePos.y = THREE.MathUtils.clamp(nextY, 0, moveRangeDebug.y);
    movePos.z = THREE.MathUtils.clamp(nextZ, -moveRangeDebug.z, moveRangeDebug.z);

    // 撞到邊界時把朝牆壁方向的速度歸零，避免速度持續累積到 MAX_SPEED，
    // 等搖桿反方向時瞬間以最大速度衝出去
    if (nextX !== movePos.x) velocity.x = 0;
    if (nextY !== movePos.y) velocity.y = 0;
    if (nextZ !== movePos.z) velocity.z = 0;

    // 拉力錨點的邏輯中心：「飛機初始位置」偏移（移動範圍以此為中心）+ AR 地板錨點
    corePos.set(
      arAnchorPos.x + movePos.x + chopperPosDebug.x,
      arAnchorPos.y + movePos.y + chopperPosDebug.y,
      arAnchorPos.z + movePos.z + chopperPosDebug.z
    );

    // 桌機測試的定位點標記：固定在「初始放置位置」的地面正下方（不隨搖桿移動），
    // 代表 AR 模式下原本會點按放置的那個點；跟著「飛機初始 X/Z」滑桿即時調整
    if (placementMarker.visible) {
      placementMarker.position.set(
        arAnchorPos.x + chopperPosDebug.x,
        arAnchorPos.y + 0.02,
        arAnchorPos.z + chopperPosDebug.z
      );
    }

    // 箭頭沿「目前機頭朝向」前移（由偵錯面板「箭頭前移量」滑桿即時調整），前移量依「目前
    // 實際飛行速度」縮放，而非單純依朝向本身：純轉向、還沒真的出發時速度是 0，箭頭就落在
    // corePos 上不偏移，旋轉中心（機頭）維持不動；等機身真的開始飛才會前移。避免朝向轉動
    // 本身就把箭頭（進而把機身）沿著圓周拖著跑，違背「圓心固定、先轉好再出發」的效果。
    const speedRatio = Math.min(1, Math.hypot(velocity.x, velocity.z) / maxSpeed);
    arrowPos.copy(corePos).addScaledVector(currentHeadingDir, chopperArrowOffsetDebug.value * speedRatio);
    headingArrow.position.copy(arrowPos);

    if (!chopperVisualInit) {
      chopperVisualPos.copy(arrowPos);
      chopperVisualVel.set(0, 0, 0);
      chopperVisualInit = true;
    }
    leashAccel.copy(arrowPos).sub(chopperVisualPos).multiplyScalar(chopperLeashDebug.stiffness)
      .addScaledVector(chopperVisualVel, -chopperLeashDebug.damping);
    chopperVisualVel.addScaledVector(leashAccel, delta);
    chopperVisualPos.addScaledVector(chopperVisualVel, delta);
    chopper.position.copy(chopperVisualPos);

    // 角度回彈層：彈簧目標永遠是 0（原本角度），只有「垂直速度變化」的瞬間才會踢一下彈簧，
    // 讓機身先多轉一點角度、再彈回原本朝向——跟朝著陀螺儀角度持續同步的穩態偏移不同，
    // 這裡疊加的是一次性衝量，效果不會被目前的傾斜角度蓋過去
    // （上升速度變小/停止：踢出負向衝量，頭部先下沉再彈回；下降變小/停止則相反）
    // 只在「沒有按上升按鈕」（放開後緩慢下沉）時才踢衝量，
    // 避免按著按鈕、速度朝上升目標加速逼近的過程中也被當成一次「速度變化」而誤觸回彈
    const deltaVelY = velocity.y - prevVelY;
    prevVelY = velocity.y;
    if (RECOIL_ENABLED) {
      if (!state.altUp) {
        pitchRecoilVel += deltaVelY * chopperPitchRecoilDebug.gain;
      }
      const pitchRecoilAccel = -pitchRecoilOffset * chopperPitchRecoilDebug.stiffness - pitchRecoilVel * chopperPitchRecoilDebug.damping;
      pitchRecoilVel += pitchRecoilAccel * delta;
      pitchRecoilOffset += pitchRecoilVel * delta;
    }

    // 上升傾角：按住上升按鈕時逼近上仰上限，放開後逼近水平（0）
    const ascendPitchTarget = state.altUp ? ASCEND_PITCH_MAX : 0;
    ascendPitch += (ascendPitchTarget - ascendPitch) * Math.min(1, ASCEND_PITCH_RATE * delta);

    // currentHeadingYaw 本身已經是逐漸逼近目標朝向後的角度（轉向阻尼已套用在上面），
    // 這裡直接指派四元數即可，不需要再對四元數額外 slerp（否則等於把轉向阻尼疊加兩次）
    headingEuler.set(pitchRecoilOffset + ascendPitch, currentHeadingYaw, 0, 'YXZ');
    headingQuat.setFromEuler(headingEuler).multiply(offsetQuat);
    chopper.quaternion.copy(headingQuat);

    // 垂直回彈層：彈簧目標永遠是 0（機身真正該在的位置），只有「垂直速度變化」的瞬間
    // 才會踢一下彈簧，讓機身先多位移一點、再準確彈回原本該在的高度——飛行中速度穩定
    // （不論是否為 0）時不會有持續偏移，只有加速/減速瞬間才看得到這個反作用力效果
    // （上升變慢/停止：先多沉一點再彈回；下降變慢/停止：先多衝高一點再彈回）
    // 只在「沒有按上升按鈕」（放開後緩慢下沉）時才踢衝量，
    // 避免按著按鈕、速度朝上升目標加速逼近的過程中也被當成一次「速度變化」而誤觸回彈
    const deltaVelYPos = velocity.y - prevVelYPos;
    prevVelYPos = velocity.y;
    if (RECOIL_ENABLED) {
      if (!state.altUp) {
        recoilVelY += deltaVelYPos * chopperVertLeashDebug.gain;
      }
      const recoilDampingY = chopperVertLeashDebug.damping + Math.abs(recoilVelY) * chopperVertLeashDebug.dampGain;
      const recoilAccelY = -recoilOffsetY * chopperVertLeashDebug.stiffness - recoilVelY * recoilDampingY;
      recoilVelY += recoilAccelY * delta;
      recoilOffsetY += recoilVelY * delta;
    }
    chopper.position.y += recoilOffsetY;

    // 相機固定不跟隨直升機（AR 模式下相機由 8thWall 追蹤接管）
    if (!window._xrActive) {
      camera.position.set(camDebug.x, camDebug.y, camDebug.z);
      camera.lookAt(camDebug.lookX, camDebug.lookY, camDebug.lookZ);
      if (camera.zoom !== camDebug.zoom) {
        camera.zoom = camDebug.zoom;
        camera.updateProjectionMatrix();
      }
    }
  }
  // AR 模式：只清 depth buffer，保留 8thWall 畫好的相機畫面；非 AR 全清
  if (window._xrActive) {
    renderer.clearDepth();
  } else {
    renderer.clear();
  }
  renderer.render(scene, camera);
}
// ── 8thWall AR Pipeline ──────────────────────────────────────
const _startXR = () => {
  window._xrActive = true;
  document.getElementById('camera-bg').style.display = 'none';
  // AR 模式套用直升機縮放預設值：未校準時用實機測試調出來的 1.05（見上方 window.AR_DEFAULT_SCALE
  // 與 loadArCalibration），若使用者用「儲存目前縮放為預設」校準過，改用已儲存值。
  // 模型包圍盒不規則（旋翼／機尾伸出去的部分），縮放倍率跟實際公尺數並非單純線性換算，
  // 這個預設值是直接在裝置上比對出來的，不是公式推算的。地板定位圈（見 updateReticleFootprint）
  // 會跟著等比例縮放。用 setChopperScale 而不是直接寫 window.chopperDebug.scale，讓常駐面板的
  // 「縮放」滑桿顯示值同步更新，不會出現滑桿畫面停在舊數字、但實際套用的是這裡蓋掉的新值的情況。
  window.setChopperScale(window.AR_DEFAULT_SCALE);

  // 「請對準地板，點按螢幕放置」的提示已併入姿態引導遮罩的文字（見 updateOrientGuide），
  // 角度符合後會自動切換顯示，不再另外疊加一個獨立的提示泡泡

  const chopperARModule = {
    name: 'chopperAR',

    // Three.js camera ← 8thWall SLAM 追蹤資料（每幀更新）
    onUpdate: ({ processCpuResult }) => {
      if (!processCpuResult.reality) return;
      const { rotation: r, position: p, intrinsics } = processCpuResult.reality;
      const _t = performance.now() / 1000;
      _rawCamPos.set(p.x, p.y, p.z);
      _rawCamQuat.set(r.x, r.y, r.z, r.w);
      camera.position.copy(cameraPosFilter.filter(_rawCamPos, _t));
      camera.quaternion.copy(cameraQuatFilter.filter(_rawCamQuat, _t));
      if (intrinsics) {
        camera.projectionMatrix.fromArray(intrinsics);
        camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      }
      // 未放置時：持續偵測螢幕中央地板，讓 reticle 自動浮在地板上
      if (!arPlaced) {
        const _ch = XR8.XrController.hitTest(0.5, 0.5, { DETECTED_SURFACE: true });
        if (_ch && _ch.length > 0) {
          const hp = _ch[0].position;
          const hr = _ch[0].rotation; // 命中表面法向量對應的四元數，貼平面/桌緣等非水平表面時會跟著傾斜
          _hitPosTmp.set(hp.x, hp.y, hp.z);
          reticlePosFilter.filter(_hitPosTmp, _t, reticleSmoothed); // 第一筆樣本濾波器會直接對齊，不會從原點平滑過來
          if (hr) {
            _hitRotTmp.set(hr.x, hr.y, hr.z, hr.w);
            reticleRotFilter.filter(_hitRotTmp, _t, reticleSmoothedQuat);
          }
          reticle.position.copy(reticleSmoothed);
          reticle.quaternion.copy(reticleSmoothedQuat);
          reticle.visible = true;
          reticlePlane.position.copy(reticleSmoothed);
          reticlePlane.quaternion.copy(reticleSmoothedQuat);
          reticlePlane.visible = true;

          // 遠距離時單眼 SLAM 的深度估計雜訊較大，需連續 N 幀的偵測結果都落在容許誤差內
          // 才視為穩定，避免瞬間雜訊造成放置高度偏差（懸空／陷地）；改用平滑後的位置
          // （reticleSmoothed）取樣，比直接用單幀原始 hp 雜訊小很多，變綠後也比較不會抖動
          reticleHistory.push(reticleSmoothed.clone());
          if (reticleHistory.length > RETICLE_STABLE_FRAMES) reticleHistory.shift();
          if (reticleHistory.length === RETICLE_STABLE_FRAMES) {
            const avg = new THREE.Vector3();
            reticleHistory.forEach(v => avg.add(v));
            avg.multiplyScalar(1 / reticleHistory.length);
            let maxDev = 0;
            reticleHistory.forEach(v => { maxDev = Math.max(maxDev, v.distanceTo(avg)); });
            if (!reticleStable) {
              reticleStable = maxDev < RETICLE_STABLE_TOL;
              reticleUnstableStreak = 0;
            } else if (maxDev < RETICLE_STABLE_TOL_EXIT) {
              reticleUnstableStreak = 0;
            } else if (++reticleUnstableStreak >= RETICLE_UNSTABLE_GRACE) {
              reticleStable = false;
              reticleUnstableStreak = 0;
            }
          } else {
            reticleStable = false;
            reticleUnstableStreak = 0;
          }
          reticleMat.color.setHex(reticleStable ? 0x00ff88 : 0xffaa00);
          reticlePlaneFillMat.color.setHex(reticleStable ? 0x00ff88 : 0xffaa00);
          reticleGridHelper.material.color.setHex(reticleStable ? 0x00ff88 : 0xffaa00);
        } else {
          reticle.visible = false;
          reticlePlane.visible = false;
          resetReticleStability();
        }
      }
    },

    // 每幀渲染：呼叫現有 animate 邏輯
    onRender: () => { animate(); },
  };

  // 點按螢幕 → 放置直升機到 reticle 位置（reticle 由 onUpdate 即時更新）
  // 需同時滿足：地板已偵測到（reticle 可見）＋ 偵測結果已連續多幀穩定＋手機角度已符合姿態引導的要求
  renderer.domElement.addEventListener('touchend', (e) => {
    // 避免觸碰搖桿區域時也觸發（搖桿在右下，reticle 需可見才放置）
    if (reticle.visible && reticleStable && !arPlaced && window.orientGuideOk) {
      arAnchorPos.copy(reticleSmoothed);
      // 只加一個貼地用的極小偏移（避免完全貼合地板造成 z-fighting），不扣掉 chopperPosDebug.y：
      // corePos 每幀都是 arAnchorPos + movePos + chopperPosDebug（見下方 animate() 內的 corePos.set），
      // X／Z 兩軸從來不會在這裡被扣掉自己、Y 軸原本卻會被扣掉一次，導致「上下定位」在放置當下
      // 的效果永遠被自己抵銷成固定值，改滑桿預設值對放置瞬間的高度完全沒有作用，只有放置後
      // 再手動調整（跟放置當下的值產生差值）才看得出效果。拿掉這個抵銷，讓 Y 跟 X／Z 一致，
      // chopperPosDebug.y 才會是「相對偵測到的地板，永遠有效」的絕對高度偏移。
      arAnchorPos.y += 0.001;
      // 放置前機身完全靜止（見 animate() 內的 arPlaced 判斷式），這裡仍重置一次移動狀態，
      // 避免長按重置後重新放置時，殘留前一次飛行的位置／速度造成新錨點對不準 reticle
      movePos.set(0, 0, 0);
      velocity.set(0, 0, 0);
      chopperVisualInit = false; // 重新放置時，機身視覺位置直接對齊新錨點，不從舊位置飛過來
      recoilOffsetY = 0;
      recoilVelY = 0;
      prevVelYPos = 0;
      pitchRecoilOffset = 0;
      pitchRecoilVel = 0;
      hasStartedMoving = false;
      arPlaced = true;
      window.arPlaced = true;
      chopperShouldBeVisible = true;
      applyChopperVisibility();
      // 記錄放置那一刻的定位圈實際半徑，供「儲存目前縮放為預設」反推縮放／定位圈比例用
      window.lastPlacedReticleRadius = reticle.scale.x;
      reticle.visible = false;
      reticlePlane.visible = false;
      // 放置成功震動確認（僅 Android Chrome 支援，iOS Safari 無此 API 時靜默略過）
      if ('vibrate' in navigator) navigator.vibrate([15, 30, 15, 30, 80]);
    }
  });

  // 長按 2 秒 → 重置放置位置
  let _holdTimer = null;
  renderer.domElement.addEventListener('touchstart', (e) => {
    e.preventDefault();
    _holdTimer = setTimeout(() => {
      arPlaced = false;
      window.arPlaced = false;
      chopperShouldBeVisible = false;
      applyChopperVisibility();
      resetReticleStability();
    }, 2000);
  }, { passive: false });
  renderer.domElement.addEventListener('touchend', () => clearTimeout(_holdTimer));

  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(), // 渲染相機畫面到背景
    XR8.XrController.pipelineModule(),       // SLAM 世界追蹤
    chopperARModule,                         // Three.js 橋接模組
  ]);

  XR8.run({ canvas: renderer.domElement });
};

// 8thWall 已載入 → 直接啟動；否則等待 xrloaded 事件
// Fallback：3 秒後仍未啟動 AR（桌機/網路問題）→ 維持原有動畫迴圈
if (window.XR8) {
  _startXR();
} else {
  window.addEventListener('xrloaded', _startXR);
  setTimeout(() => {
    if (!window._xrActive) {
      // 非 AR 模式沒有「點按放置」流程，直接顯示機身
      chopperShouldBeVisible = true;
      applyChopperVisibility();
      // 桌機測試沒有相機/姿態感測器可用，姿態引導遮罩會因為角度永遠不符合而卡住畫面，
      // 這裡直接視同「定位已完成」跳過引導，停在可操作的畫面上
      window.arPlaced = true;
      window.orientGuideOk = true;
      document.getElementById('orient-guide').classList.add('hidden-guide');
      // 顯示綠色定位點標記，並停用放開按鈕後的自動下沉（定高懸停在標記正上方）
      window._holdAltitude = true;
      placementMarker.visible = true;
      requestAnimationFrame(function _fallbackLoop() {
        animate();
        requestAnimationFrame(_fallbackLoop);
      });
    }
  }, 3000);
}
</script>
</body>
